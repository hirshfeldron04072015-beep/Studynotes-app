<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>StudyNotes</title>
<style>
:root{--bg:#0b0b0d;--panel:#111114;--panel2:#17171b;--line:#2a2a30;--text:#f5f5f5;--muted:#92929a;--soft:#c7c7cc;--accent:#fff;--radius:18px;--fs:17px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100vh;display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.sidebar{background:#0d0d10;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:11px;font-weight:750;font-size:20px}
.brand-mark{width:31px;height:31px;border:1px solid #777;border-radius:50%;position:relative}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;inset:6px -2px;border:1px solid #aaa;border-radius:50%;transform:rotate(60deg)}
.brand-mark:after{transform:rotate(-60deg)}
.search{margin:0 14px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px}
.search input{width:100%;background:none;border:0;outline:0;color:var(--text)}
.nav{padding:0 10px}.nav button,.folder-row{width:100%;border:0;background:transparent;padding:10px 11px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:10px;color:var(--soft)}
.nav button:hover,.folder-row:hover{background:#18181c}.nav button.active,.folder-row.active{background:#202024;color:#fff}
.folder-row{cursor:pointer}.folder-dot{width:10px;height:10px;border-radius:50%;border:1px solid #777;background:#555;flex:none}
.folder-dot.light{background:#aaa}.folder-dot.white{background:#eee}.folder-dot.dark{background:#333}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#666;padding:18px 12px 7px}
.sidebar-bottom{margin-top:auto;padding:10px;display:grid;gap:6px}.small-btn{background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 11px;text-align:left;color:var(--muted)}.small-btn:hover{background:#17171a;color:#fff}
.main{min-width:0;display:flex;flex-direction:column}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}
.title-wrap{min-width:0}.title{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px}.icon-btn{height:38px;min-width:38px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.icon-btn:hover{background:#242428}
.editor-shell{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.editor-pane,.preview-pane{min-width:0;overflow:auto}.editor-pane{border-right:1px solid var(--line)}
.toolbar{position:sticky;top:0;z-index:4;background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:5px;flex-wrap:wrap}.tool{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;color:var(--soft)}.tool:hover{background:#1d1d21;color:#fff}
textarea#editor{display:block;width:100%;min-height:calc(100% - 55px);height:100%;resize:none;background:transparent;border:0;outline:0;color:var(--text);padding:28px 30px 100px;font-size:var(--fs);line-height:1.65;letter-spacing:.01em}
.preview-pane{padding:30px 34px 100px}.markdown{max-width:820px;margin:auto;font-size:var(--fs);line-height:1.7;color:#e5e5e8}.markdown h1{font-size:2em;line-height:1.15}.markdown h2{font-size:1.45em}.markdown h3{font-size:1.15em}.markdown code{background:#1c1c20;padding:2px 6px;border-radius:6px}.markdown pre{background:#111114;border:1px solid var(--line);padding:15px;border-radius:12px;overflow:auto}.markdown blockquote{border-left:3px solid #666;padding-left:15px;color:#aaa}.markdown a{color:#fff}.markdown mark{background:#555;color:#fff;padding:0 2px;border-radius:2px}
.status{position:fixed;bottom:12px;right:18px;background:#111114;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:#777;font-size:11px;pointer-events:none}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}.empty strong{display:block;color:#eee;font-size:20px;margin-bottom:7px}
.notes-list{overflow:auto;padding:4px 10px;min-height:80px}.note-item{padding:11px;border-radius:12px;cursor:pointer;border:1px solid transparent}.note-item:hover{background:#161619}.note-item.active{background:#202024;border-color:#2c2c31}.note-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-meta{font-size:11px;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:100;backdrop-filter:blur(7px)}.modal-back.show{display:grid}.modal{width:min(460px,calc(100% - 30px));background:#151519;border:1px solid #303036;border-radius:20px;padding:24px;box-shadow:0 25px 80px #000}.modal h2{margin:0 0 8px}.modal p{color:#aaa;line-height:1.5}.modal input{width:100%;padding:12px;border-radius:11px;border:1px solid #38383e;background:#0d0d10;color:#fff;outline:0;margin:9px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.primary{background:#f5f5f5;color:#080808;border:0;border-radius:11px;padding:10px 16px;font-weight:700}.secondary{background:#222227;border:1px solid #38383e;border-radius:11px;padding:10px 16px}
.launch{position:fixed;inset:0;background:#080809;z-index:200;display:grid;place-items:center;transition:opacity .55s ease,visibility .55s}.launch.hide{opacity:0;visibility:hidden;pointer-events:none}.launch-card{text-align:center;animation:rise .8s ease}.launch-logo{width:150px;height:150px;object-fit:contain;filter:grayscale(1);margin-bottom:22px}.launch h1{font-size:42px;letter-spacing:-.04em;margin:0}.launch p{color:#888;margin:9px 0 28px}.start{padding:13px 28px;border-radius:13px;border:1px solid #fff;background:#fff;color:#000;font-weight:750;font-size:16px}.start:hover{transform:translateY(-1px)}@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.help{position:fixed;right:15px;bottom:42px;width:34px;height:34px;border-radius:50%;background:#17171b;border:1px solid #333;color:#aaa;z-index:20}
@media(max-width:900px){.app{grid-template-columns:240px 1fr}.editor-shell{grid-template-columns:1fr}.preview-pane{display:none}}
@media(max-width:650px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 13px}.editor-pane{border:0}textarea#editor{padding:22px 18px 100px}.launch h1{font-size:34px}}
</style>
</head>
<body>

<div class="launch" id="launch">
  <div class="launch-card">
    <img class="launch-logo" id="launchLogo" alt="StudyNotes logo">
    <h1>StudyNotes</h1>
    <p>A focused space for learning, thinking and writing.</p>
    <button class="start" id="startBtn">Start studying</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"></div><span>StudyNotes</span></div>
    <div class="search">⌕ <input id="search" placeholder="Search notes…"></div>

    <div class="nav">
      <button id="allBtn" class="active">▤ &nbsp;All notes</button>
      <button id="pinnedBtn">☆ &nbsp;Pinned</button>
    </div>

    <div class="section-label">Folders</div>
    <div class="nav" id="folders"></div>

    <div class="notes-list" id="notesList"></div>

    <div class="sidebar-bottom">
      <button class="small-btn" id="newFolderBtn">＋ New folder</button>
      <button class="small-btn" id="templateBtn">▣ Templates</button>
      <button class="small-btn" id="settingsBtn">⚙ Settings</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title-wrap">
        <div class="title" id="noteTitle">Select a note</div>
        <div class="sub" id="noteSub">StudyNotes</div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="pinBtn" title="Pin">☆</button>
        <button class="icon-btn" id="duplicateBtn" title="Duplicate">⧉</button>
        <button class="icon-btn" id="moveBtn" title="Move">⇥</button>
        <button class="icon-btn" id="deleteBtn" title="Delete">⌫</button>
        <button class="icon-btn" id="newBtn" title="New note">＋</button>
      </div>
    </header>

    <section class="editor-shell">
      <div class="editor-pane">
        <div class="toolbar">
          <button class="tool" data-cmd="bold"><b>B</b></button>
          <button class="tool" data-cmd="italic"><i>I</i></button>
          <button class="tool" data-cmd="h1">H1</button>
          <button class="tool" data-cmd="h2">H2</button>
          <button class="tool" data-cmd="check">☑</button>
          <button class="tool" data-cmd="bullet">•</button>
          <button class="tool" data-cmd="number">1.</button>
          <button class="tool" data-cmd="code">&lt;/&gt;</button>
          <button class="tool" data-cmd="quote">❝</button>
          <button class="tool" data-cmd="link">↗</button>
          <button class="tool" data-cmd="highlight">▰</button>
        </div>
        <textarea id="editor" spellcheck="true" placeholder="Start writing…"></textarea>
      </div>
      <div class="preview-pane"><article class="markdown" id="preview"></article></div>
    </section>
  </main>
</div>

<div class="status" id="status">0 words · 0 chars · 0 min</div>
<button class="help" id="helpBtn" title="Help">?</button>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal"></div>
</div>

<script>
const KEY="studynotes.v5.notes", FKEY="studynotes.v5.folders", PKEY="studynotes.v5.privateCode", SKEY="studynotes.v5.settings";
const PRIVATE="private";
let notes=JSON.parse(localStorage.getItem(KEY)||"null")||[
 {id:crypto.randomUUID(),title:"Welcome to StudyNotes",content:"# Welcome to StudyNotes\\n\\nThis is your focused space for studying.\\n\\n- Create notes\\n- Organize them into folders\\n- Pin important notes\\n- Use Markdown and the live preview\\n\\n**Tip:** Press ⌘/Ctrl + N to create a new note.",folder:"General",pinned:false,created:Date.now(),updated:Date.now()}
];
let folders=JSON.parse(localStorage.getItem(FKEY)||"null")||["General","School","Ideas"];
let settings=JSON.parse(localStorage.getItem(SKEY)||"null")||{font:17,startup:true};
let state={activeId:notes[0]?.id||null,filter:"all",folder:null,search:"",privateUnlocked:false};

function save(){localStorage.setItem(KEY,JSON.stringify(notes));localStorage.setItem(FKEY,JSON.stringify(folders));localStorage.setItem(SKEY,JSON.stringify(settings))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function md(src){
 let s=esc(src||"");
 s=s.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
 s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
 s=s.replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>");
 s=s.replace(/^\- \[ \] (.*)$/gm,"<div>☐ $1</div>").replace(/^\- \[x\] (.*)$/gim,"<div>☑ $1</div>");
 s=s.replace(/^\- (.*)$/gm,"<div>• $1</div>").replace(/^\d+\. (.*)$/gm,"<div>$&</div>");
 s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/==(.+?)==/g,"<mark>$1</mark>");
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>");
 return s.split(/\n{2,}/).map(x=>x.match(/^<(h[1-3]|pre|blockquote|div)/)?x:"<p>"+x.replace(/\n/g,"<br>")+"</p>").join("");
}
function current(){return notes.find(n=>n.id===state.activeId)}
function visibleNotes(){
 let arr=notes;
 if(state.filter==="pinned")arr=arr.filter(n=>n.pinned);
 if(state.folder)arr=arr.filter(n=>n.folder===state.folder);
 if(state.folder===PRIVATE && !state.privateUnlocked)return [];
 if(state.search){let q=state.search.toLowerCase();arr=arr.filter(n=>(n.title+" "+n.content).toLowerCase().includes(q))}
 return arr.sort((a,b)=>(b.pinned-a.pinned)||((b.updated||0)-(a.updated||0)));
}
function renderFolders(){
 const box=document.getElementById("folders");
 box.innerHTML="";
 [...folders,PRIVATE].forEach((f,i)=>{
   const b=document.createElement("button");b.className="folder-row"+(state.folder===f?" active":"");
   const dot=document.createElement("span");dot.className="folder-dot "+(["light","white","dark"][i%3]);
   b.append(dot,document.createTextNode(f===PRIVATE?"▣ Private":f));
   b.onclick=()=>{if(f===PRIVATE){openPrivate()}else{state.folder=f;state.filter="all";state.activeId=null;render()}};box.appendChild(b);
 });
}
function renderList(){
 const box=document.getElementById("notesList"), arr=visibleNotes();box.innerHTML="";
 if(state.folder===PRIVATE&&!state.privateUnlocked){box.innerHTML='<div class="empty"><div><strong>Private is locked</strong>Unlock it to see your notes.</div></div>';return}
 if(!arr.length){box.innerHTML='<div class="empty"><div><strong>No notes</strong>Create your first note.</div></div>';return}
 arr.forEach(n=>{const d=document.createElement("div");d.className="note-item"+(n.id===state.activeId?" active":"");d.innerHTML='<div class="note-name">'+(n.pinned?"★ ":"")+esc(n.title||"Untitled")+'</div><div class="note-meta">'+esc(n.folder)+" · "+new Date(n.updated).toLocaleDateString()+"</div>";d.onclick=()=>{state.activeId=n.id;render()};box.appendChild(d)})
}
function renderEditor(){
 const n=current(), ed=document.getElementById("editor"), pre=document.getElementById("preview");
 if(!n){document.getElementById("noteTitle").textContent="Select a note";document.getElementById("noteSub").textContent="StudyNotes";ed.value="";pre.innerHTML='<div class="empty"><div><strong>Choose a note</strong>Select one from the sidebar or create a new one.</div></div>';return}
 document.getElementById("noteTitle").textContent=n.title||"Untitled";document.getElementById("noteSub").textContent=n.folder+" · Updated "+new Date(n.updated).toLocaleString();ed.value=n.content;pre.innerHTML=md(n.content);document.getElementById("pinBtn").textContent=n.pinned?"★":"☆";
 updateStats(n.content);
}
function updateStats(s){let words=(s.trim().match(/\S+/g)||[]).length,chars=s.length,mins=Math.max(0,Math.ceil(words/200));document.getElementById("status").textContent=`${words} words · ${chars} chars · ${mins} min`}
function render(){renderFolders();renderList();renderEditor();document.getElementById("allBtn").classList.toggle("active",state.filter==="all"&&!state.folder);document.getElementById("pinnedBtn").classList.toggle("active",state.filter==="pinned")}
function newNote(){
 if(state.folder===PRIVATE&&!state.privateUnlocked){openPrivate();return}
 const folder=state.folder||"General";const n={id:crypto.randomUUID(),title:"Untitled note",content:"",folder,pinned:false,created:Date.now(),updated:Date.now()};notes.unshift(n);state.activeId=n.id;save();render();setTimeout(()=>{const e=document.getElementById("editor");e.focus();e.setSelectionRange(0,0)},50)
}
function deleteNote(){let n=current();if(!n)return;if(confirm("Delete this note?")){notes=notes.filter(x=>x.id!==n.id);state.activeId=visibleNotes()[0]?.id||null;save();render()}}
function duplicate(){let n=current();if(!n)return;let c={...n,id:crypto.randomUUID(),title:(n.title||"Untitled")+" copy",created:Date.now(),updated:Date.now()};notes.unshift(c);state.activeId=c.id;save();render()}
function moveNote(){let n=current();if(!n)return;let choices=folders.filter(f=>f!==PRIVATE);if(state.privateUnlocked)choices.push(PRIVATE);let target=prompt("Move to folder:\n"+choices.join("\n"),n.folder);if(target&&choices.includes(target)){n.folder=target;n.updated=Date.now();save();render()}}
function openPrivate(){
 const code=localStorage.getItem(PKEY);
 if(!code){showModal("Create your private code",`<p>This is your first time opening Private. Create a code to protect this folder.<br><br><b>Remember it — it cannot be recovered.</b></p><input id="modalInput" type="password" placeholder="Create code"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" id="modalOK">Create code</button></div>`,()=>{let v=document.getElementById("modalInput").value;if(!v){alert("Please enter a code.");return false}localStorage.setItem(PKEY,v);state.privateUnlocked=true;state.folder=PRIVATE;state.filter="all";state.activeId=notes.find(n=>n.folder===PRIVATE)?.id||null;save();render();return true});return}
 showModal("Unlock Private","<p>Enter your private code to continue.</p><input id=\"modalInput\" type=\"password\" placeholder=\"Private code\"><div class=\"modal-actions\"><button class=\"secondary\" onclick=\"closeModal()\">Cancel</button><button class=\"primary\" id=\"modalOK\">Unlock</button></div>",()=>{let v=document.getElementById("modalInput").value;if(v!==code){alert("Incorrect code.");return false}state.privateUnlocked=true;state.folder=PRIVATE;state.filter="all";state.activeId=notes.find(n=>n.folder===PRIVATE)?.id||null;render();return true})
}
let modalAction=null;
function showModal(title,body,action){document.getElementById("modal").innerHTML="<h2>"+title+"</h2>"+body;document.getElementById("modalBack").classList.add("show");modalAction=action;document.getElementById("modalOK")?.addEventListener("click",()=>{if(modalAction?.()!==false)closeModal()});setTimeout(()=>document.getElementById("modalInput")?.focus(),50)}
function closeModal(){document.getElementById("modalBack").classList.remove("show");modalAction=null}
function addFolder(){let f=prompt("New folder name:");if(f){f=f.trim();if(f&&!folders.includes(f)&&f!==PRIVATE){folders.push(f);save();render()}}}
function templates(){showModal("Student templates",`<p>Choose a template to add as a new note.</p><div class="modal-actions" style="justify-content:stretch;flex-wrap:wrap"><button class="secondary" onclick="templateMake('Lecture notes')">Lecture notes</button><button class="secondary" onclick="templateMake('Book summary')">Book summary</button><button class="secondary" onclick="templateMake('Exam revision')">Exam revision</button><button class="secondary" onclick="templateMake('Project plan')">Project plan</button></div>`)}
function templateMake(t){closeModal();let text={ "Lecture notes":"# Lecture notes\\n\\n## Topic\\n\\n## Key ideas\\n- \\n\\n## Questions\\n- \\n","Book summary":"# Book summary\\n\\n## Main idea\\n\\n## Important points\\n- \\n\\n## My thoughts\\n","Exam revision":"# Exam revision\\n\\n## What I need to know\\n- [ ] \\n\\n## Difficult topics\\n- \\n\\n## Quick questions\\n1. \\n","Project plan":"# Project plan\\n\\n## Goal\\n\\n## Tasks\\n- [ ] \\n\\n## Deadline\\n"}[t];let n={id:crypto.randomUUID(),title:t,content:text,folder:state.folder||"General",pinned:false,created:Date.now(),updated:Date.now()};notes.unshift(n);state.activeId=n.id;save();render()}
function settingsModal(){showModal("Settings",`<p>Editor font size</p><input id="fontInput" type="number" min="13" max="28" value="${settings.font}"><p>Show startup screen on launch</p><button class="secondary" id="startupToggle">${settings.startup?"On":"Off"}</button><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="saveSettings()">Save</button></div>`)}
function saveSettings(){let v=parseInt(document.getElementById("fontInput").value)||17;settings.font=Math.max(13,Math.min(28,v));settings.startup=settings.startup;document.documentElement.style.setProperty("--fs",settings.font+"px");save();closeModal()}
function help(){showModal("StudyNotes help",`<p><b>⌘/Ctrl + N</b> new note<br><b>⌘/Ctrl + S</b> save<br><b>⌘/Ctrl + F</b> search<br><b>⌘/Ctrl + B</b> bold<br><b>⌘/Ctrl + I</b> italic</p><p>Use Markdown in the editor and see the live preview on the right. Private notes are protected by the code you create the first time you open Private.</p><div class="modal-actions"><button class="primary" onclick="closeModal()">Done</button></div>`)}
function format(cmd){
 const e=document.getElementById("editor");if(!current())return;let a=e.selectionStart,b=e.selectionEnd,v=e.value,sel=v.slice(a,b),out=sel;
 if(cmd==="bold")out="**"+sel+"**";if(cmd==="italic")out="*"+sel+"*";if(cmd==="h1")out="# "+sel;if(cmd==="h2")out="## "+sel;if(cmd==="check")out="- [ ] "+sel;if(cmd==="bullet")out="- "+sel;if(cmd==="number")out="1. "+sel;if(cmd==="code")out="`"+sel+"`";if(cmd==="quote")out="> "+sel;if(cmd==="link")out="["+sel+"](https://)";if(cmd==="highlight")out="=="+sel+"==";
 e.setRangeText(out,a,b,"end");saveEditor()
}
function saveEditor(){let n=current();if(!n)return;let e=document.getElementById("editor");n.content=e.value;n.title=(e.value.split("\n")[0].replace(/^#+\s*/,"").trim()||"Untitled note").slice(0,80);n.updated=Date.now();save();document.getElementById("noteTitle").textContent=n.title;document.getElementById("noteSub").textContent=n.folder+" · Just now";document.getElementById("preview").innerHTML=md(n.content);updateStats(n.content);renderList()}
document.getElementById("startBtn").onclick=()=>document.getElementById("launch").classList.add("hide");
document.getElementById("editor").addEventListener("input",saveEditor);
document.getElementById("search").addEventListener("input",e=>{state.search=e.target.value;renderList()});
document.getElementById("allBtn").onclick=()=>{state.filter="all";state.folder=null;state.activeId=null;render()};
document.getElementById("pinnedBtn").onclick=()=>{state.filter="pinned";state.folder=null;state.activeId=null;render()};
document.getElementById("newBtn").onclick=newNote;document.getElementById("deleteBtn").onclick=deleteNote;document.getElementById("duplicateBtn").onclick=duplicate;document.getElementById("moveBtn").onclick=moveNote;
document.getElementById("pinBtn").onclick=()=>{let n=current();if(n){n.pinned=!n.pinned;n.updated=Date.now();save();render()}};
document.getElementById("newFolderBtn").onclick=addFolder;document.getElementById("templateBtn").onclick=templates;document.getElementById("settingsBtn").onclick=settingsModal;document.getElementById("helpBtn").onclick=help;
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>format(b.dataset.cmd));
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});
document.addEventListener("keydown",e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"){e.preventDefault();newNote()}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveEditor()}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="f"){e.preventDefault();document.getElementById("search").focus()}
});
document.documentElement.style.setProperty("--fs",settings.font+"px");
render();
</script>
</body>
</html>
