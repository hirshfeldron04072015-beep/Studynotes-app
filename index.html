<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyNotes</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#080808;
  color:#f5f5f5;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#startup{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
}

.startbox{
  text-align:center;
  padding:30px;
}

.logo{
  width:110px;
  height:110px;
  margin:auto auto 25px;
}

.logo ellipse,
.logo circle{
  fill:none;
  stroke:#fff;
  stroke-width:3;
}

.logo circle{
  fill:#fff;
  stroke:none;
}

.startbox h1{
  font-size:38px;
  margin:0 0 10px;
}

.startbox p{
  color:#999;
  margin:0 0 28px;
}

.startbtn{
  border:1px solid #fff;
  background:#fff;
  color:#000;
  padding:14px 28px;
  border-radius:12px;
  font-weight:700;
}

#app{
  display:none;
  height:100%;
  grid-template-columns:270px 1fr 330px;
  overflow:hidden;
}

#app.visible{
  display:grid;
}

.sidebar{
  border-right:1px solid #242424;
  padding:18px;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand{
  font-weight:800;
  font-size:20px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.mini-logo{
  width:30px;
  height:30px;
}

.mini-logo ellipse{
  fill:none;
  stroke:#fff;
  stroke-width:4;
}

.mini-logo circle{
  fill:#fff;
}

.search{
  width:100%;
  background:#111;
  border:1px solid #292929;
  color:#fff;
  border-radius:9px;
  padding:10px;
  margin-bottom:12px;
  outline:none;
}

.section-title{
  font-size:11px;
  color:#777;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:14px 4px 7px;
}

.folder,
.note-row{
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  background:none;
  color:#ddd;
  width:100%;
  text-align:left;
  padding:8px;
  border-radius:8px;
}

.folder:hover,
.note-row:hover,
.folder.active{
  background:#171717;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#888;
  flex:none;
}

.dot.private{
  background:#fff;
  border:2px solid #777;
}

.sidebar-bottom{
  margin-top:auto;
  display:grid;
  gap:7px;
}

.sidebtn{
  background:#111;
  border:1px solid #292929;
  color:#ddd;
  border-radius:8px;
  padding:9px;
  text-align:left;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  border-bottom:1px solid #242424;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
}

.topbar input{
  flex:1;
  background:transparent;
  border:0;
  color:#fff;
  font-size:17px;
  outline:none;
}

.iconbtn{
  background:#111;
  border:1px solid #292929;
  color:#ddd;
  border-radius:8px;
  padding:8px 10px;
}

.editor-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.toolbar{
  display:flex;
  gap:5px;
  padding:8px 12px;
  border-bottom:1px solid #1d1d1d;
  flex-wrap:wrap;
}

.tool{
  background:#111;
  border:1px solid #292929;
  color:#ddd;
  border-radius:6px;
  padding:6px 9px;
}

#editor{
  flex:1;
  width:100%;
  resize:none;
  border:0;
  outline:none;
  background:#080808;
  color:#eee;
  padding:25px;
  font-size:17px;
  line-height:1.65;
}

.preview{
  display:none;
  flex:1;
  overflow:auto;
  padding:25px;
  line-height:1.65;
}

.preview.show{
  display:block;
}

.preview h1,
.preview h2,
.preview h3{
  color:#fff;
}

.preview code{
  background:#171717;
  padding:2px 5px;
  border-radius:4px;
}

.preview pre{
  background:#111;
  padding:14px;
  border-radius:9px;
  overflow:auto;
}

.preview a{
  color:#fff;
}

.status{
  border-top:1px solid #1d1d1d;
  padding:7px 14px;
  color:#777;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

.right{
  border-left:1px solid #242424;
  padding:18px;
  overflow:auto;
}

.card{
  border:1px solid #252525;
  background:#101010;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

.card h3{
  margin:0 0 10px;
  font-size:13px;
  color:#aaa;
}

.stat{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  padding:5px 0;
}

.stat b{
  color:#fff;
}

.empty{
  color:#666;
  text-align:center;
  padding:40px 10px;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modalbox{
  width:min(520px,100%);
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:20px;
}

.modalbox h2{
  margin-top:0;
}

.modalbox input,
.modalbox select{
  width:100%;
  background:#080808;
  border:1px solid #333;
  color:#fff;
  padding:10px;
  border-radius:8px;
  margin:8px 0 14px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.primary{
  background:#fff;
  color:#000;
  border:0;
  border-radius:8px;
  padding:10px 15px;
  font-weight:700;
}

.secondary{
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  padding:10px 15px;
}

#drawCanvas{
  position:fixed;
  inset:0;
  z-index:1500;
  background:#fff;
  display:none;
  touch-action:none;
}

#drawCanvas.open{
  display:block;
}

.drawbar{
  position:fixed;
  z-index:1600;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  gap:6px;
  background:#111;
  border:1px solid #333;
  padding:8px;
  border-radius:10px;
}

.drawbar.open{
  display:flex;
}

@media(max-width:950px){
  #app{
    grid-template-columns:230px 1fr;
  }

  .right{
    display:none;
  }
}

@media(max-width:650px){
  #app{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .topbar{
    padding-left:8px;
  }

  .editor-wrap{
    min-height:0;
  }
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startup">

  <div class="startbox">

    <svg class="logo" viewBox="0 0 120 120">

      <ellipse
        cx="60"
        cy="60"
        rx="49"
        ry="19"
        transform="rotate(30 60 60)"
      />

      <ellipse
        cx="60"
        cy="60"
        rx="49"
        ry="19"
        transform="rotate(-30 60 60)"
      />

      <ellipse
        cx="60"
        cy="60"
        rx="49"
        ry="19"
        transform="rotate(90 60 60)"
      />

      <circle
        cx="60"
        cy="60"
        r="7"
      />

    </svg>

    <h1>StudyNotes</h1>

    <p>
      A focused space for learning, thinking and writing.
    </p>

    <button
      id="startButton"
      class="startbtn"
      type="button"
    >
      Start studying
    </button>

  </div>

</div>


<!-- APPLICATION -->

<div id="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <svg
        class="mini-logo"
        viewBox="0 0 60 60"
      >

        <ellipse
          cx="30"
          cy="30"
          rx="25"
          ry="9"
          transform="rotate(30 30 30)"
        />

        <ellipse
          cx="30"
          cy="30"
          rx="25"
          ry="9"
          transform="rotate(-30 30 30)"
        />

        <ellipse
          cx="30"
          cy="30"
          rx="25"
          ry="9"
          transform="rotate(90 30 30)"
        />

        <circle
          cx="30"
          cy="30"
          r="4"
        />

      </svg>

      StudyNotes

    </div>


    <input
      id="search"
      class="search"
      placeholder="Search notes…"
      autocomplete="off"
    >


    <button
      id="newNote"
      class="primary"
      type="button"
    >
      ＋ New note
    </button>


    <div class="section-title">
      Folders
    </div>

    <div id="folders"></div>


    <div class="section-title">
      Notes
    </div>

    <div id="noteList"></div>


    <div class="sidebar-bottom">

      <button
        id="newFolder"
        class="sidebtn"
        type="button"
      >
        ＋ New folder
      </button>

      <button
        id="templates"
        class="sidebtn"
        type="button"
      >
        Templates
      </button>

      <button
        id="settings"
        class="sidebtn"
        type="button"
      >
        Settings
      </button>

      <button
        id="help"
        class="sidebtn"
        type="button"
      >
        ? Help & shortcuts
      </button>

      <button
        id="draw"
        class="sidebtn"
        type="button"
      >
        ✎ Drawing board
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <input
        id="title"
        placeholder="Untitled note"
      >

      <button
        id="pin"
        class="iconbtn"
        title="Pin"
      >
        ☆
      </button>

      <button
        id="duplicate"
        class="iconbtn"
        title="Duplicate"
      >
        ⧉
      </button>

      <button
        id="move"
        class="iconbtn"
        title="Move"
      >
        ↗
      </button>

      <button
        id="delete"
        class="iconbtn"
        title="Delete"
      >
        ⌫
      </button>

      <button
        id="previewBtn"
        class="iconbtn"
        title="Preview"
      >
        Preview
      </button>

    </div>


    <div class="editor-wrap">

      <div class="toolbar">

        <button
          class="tool"
          data-fmt="bold"
        >
          <b>B</b>
        </button>

        <button
          class="tool"
          data-fmt="italic"
        >
          <i>I</i>
        </button>

        <button
          class="tool"
          data-fmt="h2"
        >
          H2
        </button>

        <button
          class="tool"
          data-fmt="check"
        >
          ☑
        </button>

        <button
          class="tool"
          data-fmt="code"
        >
          Code
        </button>

        <button
          class="tool"
          data-fmt="link"
        >
          Link
        </button>

        <button
          class="tool"
          data-fmt="quote"
        >
          Quote
        </button>

      </div>


      <textarea
        id="editor"
        spellcheck="true"
        placeholder="Start writing…"
      ></textarea>


      <article
        id="preview"
        class="preview"
      ></article>


      <div class="status">

        <span id="saveStatus">
          Ready
        </span>

        <span id="stats">
          0 words · 0 characters · 0 min
        </span>

      </div>

    </div>

  </main>


  <!-- RIGHT PANEL -->

  <aside class="right">

    <div class="card">

      <h3>
        NOTE INFO
      </h3>

      <div class="stat">
        <span>Folder</span>
        <b id="infoFolder">General</b>
      </div>

      <div class="stat">
        <span>Created</span>
        <b id="infoCreated">—</b>
      </div>

      <div class="stat">
        <span>Updated</span>
        <b id="infoUpdated">—</b>
      </div>

    </div>


    <div class="card">

      <h3>
        QUICK ACTIONS
      </h3>

      <button
        class="sidebtn"
        style="width:100%;margin-bottom:7px"
        id="private"
      >
        🔒 Private folder
      </button>

      <button
        class="sidebtn"
        style="width:100%"
        id="clearSearch"
      >
        Clear search
      </button>

    </div>


    <div class="card">

      <h3>
        STUDY
      </h3>

      <div class="stat">
        <span>Total notes</span>
        <b id="totalNotes">0</b>
      </div>

      <div class="stat">
        <span>Words</span>
        <b id="totalWords">0</b>
      </div>

    </div>

  </aside>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

    <div class="modal-actions">

      <button
        id="modalCancel"
        class="secondary"
        type="button"
      >
        Cancel
      </button>

      <button
        id="modalConfirm"
        class="primary"
        type="button"
      >
        OK
      </button>

    </div>

  </div>

</div>


<!-- DRAWING BOARD -->

<canvas id="drawCanvas"></canvas>

<div
  id="drawbar"
  class="drawbar"
>

  <button
    class="secondary"
    id="penBlack"
  >
    Black pen
  </button>

  <button
    class="secondary"
    id="penGray"
  >
    Grey pen
  </button>

  <button
    class="secondary"
    id="erase"
  >
    Eraser
  </button>

  <button
    class="secondary"
    id="clearCanvas"
  >
    Clear
  </button>

  <button
    class="primary"
    id="closeDraw"
  >
    Done
  </button>

</div>


<script>

(function(){

"use strict";


/* STORAGE */

const KEY = "studynotes-v1";


/* UNIQUE ID */

function uid(){

  return Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,8);

}


/* LOAD DATA */

let data =
  JSON.parse(
    localStorage.getItem(KEY) || "null"
  );


if(!data){

  const firstId = uid();

  data = {

    folders:[
      {
        id:"general",
        name:"General",
        private:false
      }
    ],

    notes:[
      {
        id:firstId,
        title:"Welcome to StudyNotes",
        body:
"# Welcome\n\n" +
"This is your first note. Start writing here.",
        folder:"general",
        pinned:true,
        created:Date.now(),
        updated:Date.now()
      }
    ],

    privateUnlocked:false

  };

}


/* STATE */

let current =
  data.notes[0]
    ? data.notes[0].id
    : null;

let currentFolder = "all";

let query = "";

let preview = false;


/* SAVE */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  document.getElementById(
    "saveStatus"
  ).textContent =
    "Saved just now";

}


/* CURRENT NOTE */

function note(){

  return data.notes.find(
    n => n.id === current
  );

}


/* ESCAPE HTML */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c];

    }
  );

}


/* FOLDER NAME */

function folderName(id){

  const f =
    data.folders.find(
      x => x.id === id
    );

  return f
    ? f.name
    : "General";

}


/* DATE */

function fmtDate(t){

  return t
    ? new Date(t).toLocaleString()
    : "—";

}


/* RENDER EVERYTHING */

function render(){

  const folders =
    document.getElementById(
      "folders"
    );

  const list =
    document.getElementById(
      "noteList"
    );


  folders.innerHTML = "";


  /* ALL NOTES */

  const all =
    document.createElement(
      "button"
    );

  all.className =
    "folder"
    +
    (
      currentFolder === "all"
      ? " active"
      : ""
    );

  all.innerHTML =
    '<span class="dot"></span>' +
    'All notes';

  all.onclick = function(){

    currentFolder = "all";

    render();

  };

  folders.appendChild(all);


  /* FOLDERS */

  data.folders.forEach(
    function(f){

      if(
        f.private &&
        !data.privateUnlocked
      ){

        return;

      }


      const b =
        document.createElement(
          "button"
        );

      b.className =
        "folder"
        +
        (
          currentFolder === f.id
          ? " active"
          : ""
        );


      b.innerHTML =
        '<span class="dot ' +
        (
          f.private
          ? "private"
          : ""
        ) +
        '"></span>' +
        esc(f.name);


      b.onclick = function(){

        currentFolder = f.id;

        render();

      };


      folders.appendChild(b);

    }
  );


  /* NOTES */

  let notes =
    data.notes.filter(
      function(n){

        const folder =
          data.folders.find(
            f => f.id === n.folder
          );


        const rightFolder =
          currentFolder === "all"
          ||
          n.folder === currentFolder;


        const visible =
          !folder ||
          !folder.private ||
          data.privateUnlocked;


        return rightFolder && visible;

      }
    );


  /* SEARCH */

  if(query){

    notes =
      notes.filter(
        function(n){

          return (
            n.title +
            " " +
            n.body
          )
          .toLowerCase()
          .includes(
            query.toLowerCase()
          );

        }
      );

  }


  /* SORT */

  notes.sort(
    function(a,b){

      return (
        b.pinned - a.pinned
      )
      ||
      (
        b.updated -
        a.updated
      );

    }
  );


  list.innerHTML = "";


  notes.forEach(
    function(n){

      const b =
        document.createElement(
          "button"
        );

      b.className =
        "note-row";


      b.innerHTML =
        (
          n.pinned
          ? "★ "
          : ""
        )
        +
        esc(
          n.title ||
          "Untitled"
        );


      b.onclick = function(){

        select(n.id);

      };


      list.appendChild(b);

    }
  );


  /* STATS */

  document.getElementById(
    "totalNotes"
  ).textContent =
    data.notes.length;


  document.getElementById(
    "totalWords"
  ).textContent =
    data.notes.reduce(
      function(total,n){

        return total +
          n.body
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

      },
      0
    );


  updateEditor();

}


/* SELECT NOTE */

function select(id){

  current = id;

  preview = false;

  document.getElementById(
    "preview"
  ).classList.remove(
    "show"
  );

  document.getElementById(
    "editor"
  ).style.display =
    "block";

  render();

}


/* UPDATE EDITOR */

function updateEditor(){

  const n = note();


  if(!n){

    document.getElementById(
      "title"
    ).value = "";

    document.getElementById(
      "editor"
    ).value = "";

    updateStats();

    return;

  }


  document.getElementById(
    "title"
  ).value =
    n.title;


  document.getElementById(
    "editor"
  ).value =
    n.body;


  document.getElementById(
    "pin"
  ).textContent =
    n.pinned
    ? "★"
    : "☆";


  document.getElementById(
    "infoFolder"
  ).textContent =
    folderName(n.folder);


  document.getElementById(
    "infoCreated"
  ).textContent =
    fmtDate(n.created);


  document.getElementById(
    "infoUpdated"
  ).textContent =
    fmtDate(n.updated);


  updateStats();

}


/* STATS */

function updateStats(){

  const s =
    document.getElementById(
      "editor"
    ).value;


  const w =
    s.trim()
      ? s.trim()
          .split(/\s+/)
          .length
      : 0;


  document.getElementById(
    "stats"
  ).textContent =
    w +
    " words · " +
    s.length +
    " characters · " +
    Math.max(
      1,
      Math.ceil(w / 200)
    ) +
    " min";

}


/* ENSURE NOTE */

function ensureNote(){

  if(note()){

    return note();

  }


  const n = {

    id:uid(),

    title:"Untitled note",

    body:"",

    folder:
      currentFolder === "all"
      ? "general"
      : currentFolder,

    pinned:false,

    created:Date.now(),

    updated:Date.now()

  };


  data.notes.unshift(n);

  current = n.id;


  return n;

}


/* NEW NOTE */

function newNote(){

  const n = {

    id:uid(),

    title:"Untitled note",

    body:"",

    folder:
      currentFolder === "all"
      ? "general"
      : currentFolder,

    pinned:false,

    created:Date.now(),

    updated:Date.now()

  };


  data.notes.unshift(n);

  current = n.id;

  save();

  render();

  document.getElementById(
    "title"
  ).focus();

}


/* MODAL */

function showModal(
  title,
  body,
  confirmAction
){

  document.getElementById(
    "modalTitle"
  ).textContent =
    title;


  document.getElementById(
    "modalBody"
  ).innerHTML =
    body;


  document.getElementById(
    "modal"
  ).classList.add(
    "open"
  );


  document.getElementById(
    "modalConfirm"
  ).onclick =
    function(){

      confirmAction();

      closeModal();

    };


  document.getElementById(
    "modalCancel"
  ).onclick =
    closeModal;

/* MARKDOWN */

function markdown(s){

  let x = esc(s);


  x =
    x.replace(
      /```([\s\S]*?)```/g,
      "<pre><code>$1</code></pre>"
    );


  x =
    x.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  x =
    x.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  x =
    x.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  x =
    x.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );


  x =
    x.replace(
      /\*(.+?)\*/g,
      "<em>$1</em>"
    );


  x =
    x.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  x =
    x.replace(
      /^- $begin:math:display$ $end:math:display$ (.*)$/gm,
      "☐ $1"
    );


  x =
    x.replace(
      /^- $begin:math:display$x$end:math:display$ (.*)$/gmi,
      "☑ $1"
    );


  x =
    x.replace(
      /^> (.*)$/gm,
      "<blockquote>$1</blockquote>"
    );


  x =
    x.replace(
      /$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\(https\?\:\\\/\\\/\[\^\)\]\+\)$end:math:text$/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );


  x =
    x.replace(
      /\n/g,
      "<br>"
    );


  return x;

}


/* FORMAT TEXT */

function format(type){

  const e =
    document.getElementById(
      "editor"
    );


  const a =
    e.selectionStart;

  const b =
    e.selectionEnd;

  const v =
    e.value;

  const selected =
    v.slice(a,b)
    ||
    "text";


  let before = "";

  let after = "";


  if(type === "bold"){

    before = "**";

    after = "**";

  }


  if(type === "italic"){

    before = "*";

    after = "*";

  }


  if(type === "h2"){

    before = "## ";

  }


  if(type === "check"){

    before = "- [ ] ";

  }


  if(type === "code"){

    before = "`";

    after = "`";

  }


  if(type === "quote"){

    before = "> ";

  }


  if(type === "link"){

    before = "[";

    after =
      "](https://example.com)";

  }


  e.setRangeText(
    before +
    selected +
    after,
    a,
    b,
    "select"
  );


  e.dispatchEvent(
    new Event("input")
  );


  e.focus();

}


/* MOVE NOTE */

function moveNote(){

  const n = note();

  if(!n)return;


  const options =
    data.folders
      .filter(
        f =>
          !f.private ||
          data.privateUnlocked
      )
      .map(
        f =>
          '<option value="' +
          f.id +
          '" ' +
          (
            f.id === n.folder
            ? "selected"
            : ""
          ) +
          ">" +
          esc(f.name) +
          "</option>"
      )
      .join("");


  showModal(
    "Move note",
    '<select id="moveSelect">' +
    options +
    "</select>",
    function(){

      n.folder =
        document.getElementById(
          "moveSelect"
        ).value;

      n.updated =
        Date.now();

      save();

      render();

    }
  );

}


/* DUPLICATE */

function duplicate(){

  const n = note();

  if(!n)return;


  const c = {

    ...n,

    id:uid(),

    title:
      n.title +
      " copy",

    created:
      Date.now(),

    updated:
      Date.now()

  };


  data.notes.unshift(c);

  current = c.id;

  save();

  render();

}


/* DELETE */

function deleteNote(){

  const n = note();

  if(!n)return;


  showModal(
    "Delete note",
    "Delete <b>" +
    esc(n.title) +
    "</b>? This cannot be undone.",
    function(){

      data.notes =
        data.notes.filter(
          x =>
            x.id !== n.id
        );


      current =
        data.notes[0]
        ? data.notes[0].id
        : null;


      save();

      render();

    }
  );

}


/* NEW FOLDER */

function newFolder(){

  showModal(
    "New folder",
    '<input id="folderNameInput" placeholder="Folder name">',
    function(){

      const name =
        document.getElementById(
          "folderNameInput"
        ).value.trim();


      if(!name)return;


      const f = {

        id:uid(),

        name:name,

        private:false

      };


      data.folders.push(f);

      currentFolder =
        f.id;

      save();

      render();

    }
  );

}


/* PRIVATE FOLDER */

function privateFolder(){

  let f =
    data.folders.find(
      x => x.private
    );


  /* CREATE */

  if(!f){

    showModal(
      "Create private folder",
      '<input id="privateCode" type="password" placeholder="Create a code">',
      function(){

        const code =
          document.getElementById(
            "privateCode"
          ).value;


        if(!code)return;


        f = {

          id:uid(),

          name:"Private",

          private:true

        };


        data.folders.push(f);


        data.privateCode =
          btoa(code);


        data.privateUnlocked =
          true;


        currentFolder =
          f.id;


        save();

        render();

      }
    );

    return;

  }


  /* ALREADY UNLOCKED */

  if(data.privateUnlocked){

    currentFolder =
      f.id;

    render();

    return;

  }


  /* UNLOCK */

  showModal(
    "Private folder",
    '<input id="privateCode" type="password" placeholder="Enter code">',
    function(){

      const code =
        document.getElementById(
          "privateCode"
        ).value;


      if(
        btoa(code) !==
        data.privateCode
      ){

        alert(
          "Wrong code"
        );

        return;

      }


      data.privateUnlocked =
        true;


      currentFolder =
        f.id;


      save();

      render();

    }
  );

}

/* DRAWING */

const canvas =
  document.getElementById(
    "drawCanvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


let drawing = false;

let erase = false;


function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


function openDraw(){

  resizeCanvas();

  canvas.classList.add(
    "open"
  );

  document.getElementById(
    "drawbar"
  ).classList.add(
    "open"
  );

}


function closeDraw(){

  canvas.classList.remove(
    "open"
  );

  document.getElementById(
    "drawbar"
  ).classList.remove(
    "open"
  );

}


/* DRAW START */

canvas.addEventListener(
  "pointerdown",
  function(e){

    drawing = true;

    ctx.beginPath();

    ctx.moveTo(
      e.clientX,
      e.clientY
    );

  }
);


/* DRAW MOVE */

canvas.addEventListener(
  "pointermove",
  function(e){

    if(!drawing)return;


    ctx.lineWidth =
      erase
      ? 22
      : 4;


    ctx.lineCap =
      "round";


    ctx.strokeStyle =
      erase
      ? "#fff"
      : "#000";


    ctx.lineTo(
      e.clientX,
      e.clientY
    );


    ctx.stroke();

  }
);


canvas.addEventListener(
  "pointerup",
  function(){

    drawing = false;

  }
);


canvas.addEventListener(
  "pointercancel",
  function(){

    drawing = false;

  }
);


/* START APP */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /*
      IMPORTANT:
      This is the startup button.
      GitHub Pages runs this JavaScript
      directly in the browser.
    */

    document.getElementById(
      "startButton"
    ).addEventListener(
      "click",
      function(){

        document.getElementById(
          "startup"
        ).style.display =
          "none";


        document.getElementById(
          "app"
        ).classList.add(
          "visible"
        );


        render();

      }
    );


    /* NEW NOTE */

    document.getElementById(
      "newNote"
    ).onclick =
      newNote;


    /* NEW FOLDER */

    document.getElementById(
      "newFolder"
    ).onclick =
      newFolder;


    /* TEMPLATES */

    document.getElementById(
      "templates"
    ).onclick =
      templates;


    /* SETTINGS */

    document.getElementById(
      "settings"
    ).onclick =
      settings;


    /* HELP */

    document.getElementById(
      "help"
    ).onclick =
      help;


    /* DRAW */

    document.getElementById(
      "draw"
    ).onclick =
      openDraw;


    document.getElementById(
      "closeDraw"
    ).onclick =
      closeDraw;


    /* CLEAR DRAWING */

    document.getElementById(
      "clearCanvas"
    ).onclick =
      function(){

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

      };


    /* ERASER */

    document.getElementById(
      "erase"
    ).onclick =
      function(){

        erase = true;

      };


    /* BLACK PEN */

    document.getElementById(
      "penBlack"
    ).onclick =
      function(){

        erase = false;

        ctx.strokeStyle =
          "#000";

      };


    /* GREY PEN */

    document.getElementById(
      "penGray"
    ).onclick =
      function(){

        erase = false;

        ctx.strokeStyle =
          "#888";

      };


    /* PRIVATE */

    document.getElementById(
      "private"
    ).onclick =
      privateFolder;


    /* CLEAR SEARCH */

    document.getElementById(
      "clearSearch"
    ).onclick =
      function(){

        document.getElementById(
          "search"
        ).value =
          "";

        query = "";

        render();

      };


    /* TITLE */

    document.getElementById(
      "title"
    ).addEventListener(
      "input",
      function(e){

        const n =
          ensureNote();


        n.title =
          e.target.value;


        n.updated =
          Date.now();


        save();

        render();

      }
    );


    /* EDITOR */

    document.getElementById(
      "editor"
    ).addEventListener(
      "input",
      function(e){

        const n =
          ensureNote();


        n.body =
          e.target.value;


        n.updated =
          Date.now();


        save();

        updateStats();

      }
    );


    /* SEARCH */

    document.getElementById(
      "search"
    ).addEventListener(
      "input",
      function(e){

        query =
          e.target.value;

        render();

      }
    );


    /* PIN */

    document.getElementById(
      "pin"
    ).onclick =
      function(){

        const n =
          note();


        if(!n)return;


        n.pinned =
          !n.pinned;


        n.updated =
          Date.now();


        save();

        render();

      };


    /* DUPLICATE */

    document.getElementById(
      "duplicate"
    ).onclick =
      duplicate;


    /* MOVE */

    document.getElementById(
      "move"
    ).onclick =
      moveNote;


    /* DELETE */

    document.getElementById(
      "delete"
    ).onclick =
      deleteNote;


    /* PREVIEW */

    document.getElementById(
      "previewBtn"
    ).onclick =
      function(){

        const p =
          document.getElementById(
            "preview"
          );

        const e =
          document.getElementById(
            "editor"
          );


        preview =
          !preview;


        if(preview){

          p.innerHTML =
            markdown(
              e.value
            );


          p.classList.add(
            "show"
          );


          e.style.display =
            "none";


          document.getElementById(
            "previewBtn"
          ).textContent =
            "Edit";

        }
        else{

          p.classList.remove(
            "show"
          );


          e.style.display =
            "block";


          document.getElementById(
            "previewBtn"
          ).textContent =
            "Preview";

        }

      };


    /* TOOLBAR */

    document
      .querySelectorAll(
        ".tool"
      )
      .forEach(
        function(b){

          b.onclick =
            function(){

              format(
                b.dataset.fmt
              );

            };

        }
      );


    /* KEYBOARD SHORTCUTS */

    document.addEventListener(
      "keydown",
      function(e){

        if(
          (e.metaKey || e.ctrlKey)
          &&
          e.key.toLowerCase()
          ===
          "n"
        ){

          e.preventDefault();

          newNote();

        }


        if(
          (e.metaKey || e.ctrlKey)
          &&
          e.key.toLowerCase()
          ===
          "f"
        ){

          e.preventDefault();

          document.getElementById(
            "search"
          ).focus();

        }


        if(
          (e.metaKey || e.ctrlKey)
          &&
          e.key.toLowerCase()
          ===
          "b"
        ){

          e.preventDefault();

          format("bold");

        }


        if(
          (e.metaKey || e.ctrlKey)
          &&
          e.key.toLowerCase()
          ===
          "i"
        ){

          e.preventDefault();

          format("italic");

        }

      }
    );


    /* INITIAL DATA */

    save();

    render();

  }
);

})();
</script>
