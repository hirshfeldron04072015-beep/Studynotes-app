<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyNotes</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#fff;
  --panel:#f5f5f5;
  --line:#ddd;
  --text:#111;
  --muted:#777;
  --hover:#e9e9e9;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:introOut 1s ease forwards;
  animation-delay:2.4s;
}

.logo{
  width:150px;
  height:150px;
  position:relative;
}

.logo:before,
.logo:after{
  content:"";
  position:absolute;
  inset:25px;
  border:3px solid #111;
  border-radius:50%;
  transform:rotate(45deg);
}

.logo:after{
  transform:rotate(-45deg);
}

.logo-dot{
  position:absolute;
  width:30px;
  height:30px;
  border:3px solid #111;
  border-radius:50%;
  top:60px;
  left:60px;
}

.intro-title{
  position:absolute;
  margin-top:230px;
  font-size:30px;
  font-weight:700;
  letter-spacing:-1px;
}

@keyframes introOut{
  to{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
}

/* APP */

#app{
  width:100%;
  height:100%;
  display:flex;
  overflow:hidden;
}

/* LEFT PANEL */

#sidebar{
  width:285px;
  min-width:285px;
  height:100%;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  transition:width .25s ease,min-width .25s ease,transform .25s ease;
  overflow:hidden;
}

#sidebar.collapsed{
  width:0;
  min-width:0;
  border:0;
}

.sidebar-top{
  padding:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  margin-bottom:16px;
}

.mini-logo{
  width:25px;
  height:25px;
  border:2px solid #111;
  border-radius:50%;
  transform:rotate(45deg);
}

.search{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:#111;
}

.new-note{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px solid #111;
  background:#111;
  color:#fff;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}

.section{
  padding:10px 12px 4px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.folder,
.note-item{
  margin:2px 10px;
  padding:9px 10px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.folder:hover,
.note-item:hover{
  background:var(--hover);
}

.note-item.active{
  background:#ddd;
  font-weight:600;
}

.folder-dot{
  width:9px;
  height:9px;
  border:1px solid #111;
  border-radius:50%;
}

.note-list{
  overflow:auto;
  flex:1;
}

.sidebar-bottom{
  padding:12px;
  border-top:1px solid var(--line);
}

.small-button{
  width:100%;
  padding:9px;
  background:transparent;
  border:0;
  text-align:left;
  border-radius:7px;
  cursor:pointer;
}

.small-button:hover{
  background:var(--hover);
}

/* MAIN */

#main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  min-height:58px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
}

.icon-button{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  border-radius:8px;
  cursor:pointer;
  font-size:19px;
}

.icon-button:hover{
  background:var(--hover);
}

.note-status{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.editor{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.title{
  width:100%;
  border:0;
  outline:0;
  padding:38px 7%;
  padding-bottom:18px;
  font-size:38px;
  font-weight:700;
  letter-spacing:-1px;
}

.toolbar{
  margin:0 7%;
  padding:8px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  gap:4px;
  flex-wrap:wrap;
}

.tool{
  border:0;
  background:transparent;
  min-width:35px;
  height:32px;
  padding:0 9px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.tool:hover{
  background:var(--hover);
}

.content{
  flex:1;
  overflow:auto;
  padding:25px 7% 80px;
}

#editor{
  min-height:500px;
  outline:none;
  font-size:17px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

#editor:empty:before{
  content:"Start writing here...";
  color:#aaa;
}

.stats{
  border-top:1px solid var(--line);
  padding:10px 7%;
  color:var(--muted);
  font-size:12px;
}

/* PREVIEW */

#preview{
  display:none;
  font-size:17px;
  line-height:1.7;
}

#preview h1,#preview h2,#preview h3{
  line-height:1.25;
}

#preview code{
  background:#eee;
  padding:2px 5px;
  border-radius:4px;
}

#preview pre{
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:8px;
  overflow:auto;
}

#preview blockquote{
  border-left:3px solid #111;
  padding-left:15px;
  color:#666;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border:1px solid #111;
  border-radius:14px;
  padding:22px;
}

.modal-box h2{
  margin-top:0;
}

.modal-input{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:7px;
  margin:7px 0 12px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

.modal-actions button{
  padding:9px 14px;
  border-radius:7px;
  border:1px solid #111;
  cursor:pointer;
  background:#fff;
}

.modal-actions .primary{
  background:#111;
  color:#fff;
}

/* DRAWING */

#drawCanvas{
  width:100%;
  height:400px;
  border:1px solid var(--line);
  touch-action:none;
  background:#fff;
}

/* MOBILE / IPAD */

@media(max-width:800px){

  #sidebar{
    position:fixed;
    z-index:200;
    left:0;
    top:0;
    bottom:0;
    box-shadow:5px 0 20px rgba(0,0,0,.08);
  }

  #sidebar.collapsed{
    transform:translateX(-100%);
    width:285px;
    min-width:285px;
  }

  .title{
    font-size:30px;
    padding-left:5%;
    padding-right:5%;
  }

  .toolbar{
    margin-left:5%;
    margin-right:5%;
  }

  .content{
    padding-left:5%;
    padding-right:5%;
  }

  .stats{
    padding-left:5%;
    padding-right:5%;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="logo">
    <div class="logo-dot"></div>
  </div>
  <div class="intro-title">StudyNotes</div>
</div>

<!-- APP -->
<div id="app">

  <!-- LEFT PANEL -->
  <aside id="sidebar">

    <div class="sidebar-top">

      <div class="brand">
        <div class="mini-logo"></div>
        StudyNotes
      </div>

      <input
        id="search"
        class="search"
        type="text"
        placeholder="Search notes..."
      >

      <button class="new-note" data-action="new">
        + New note
      </button>

    </div>

    <div class="section">Folders</div>

    <div id="folders">
      <div class="folder" data-folder="General">
        <span class="folder-dot"></span>
        General
      </div>

      <div class="folder" data-folder="Biology">
        <span class="folder-dot"></span>
        Biology
      </div>

      <div class="folder" data-folder="Math">
        <span class="folder-dot"></span>
        Math
      </div>

      <div class="folder" data-folder="History">
        <span class="folder-dot"></span>
        History
      </div>

      <div class="folder" data-folder="Private">
        <span class="folder-dot"></span>
        Private
      </div>
    </div>

    <div class="section">Notes</div>

    <div id="noteList" class="note-list"></div>

    <div class="sidebar-bottom">

      <button class="small-button" data-action="templates">
        Templates
      </button>

      <button class="small-button" data-action="draw">
        Drawing
      </button>

      <button class="small-button" data-action="settings">
        Settings
      </button>

      <button class="small-button" data-action="help">
        ? Help
      </button>

    </div>

  </aside>

  <!-- MAIN WRITING AREA -->
  <main id="main">

    <div class="topbar">

      <button
        class="icon-button"
        data-action="toggle-sidebar"
        title="Show / hide sidebar"
      >
        ☰
      </button>

      <button
        class="icon-button"
        data-action="preview"
        title="Preview"
      >
        ◉
      </button>

      <button
        class="icon-button"
        data-action="pin"
        title="Pin note"
      >
        ☆
      </button>

      <button
        class="icon-button"
        data-action="duplicate"
        title="Duplicate note"
      >
        ⧉
      </button>

      <button
        class="icon-button"
        data-action="delete"
        title="Delete note"
      >
        ×
      </button>

      <div id="status" class="note-status">
        Saved
      </div>

    </div>

    <div class="editor">

      <input
        id="title"
        class="title"
        placeholder="Note title"
      >

      <div class="toolbar">

        <button class="tool" data-format="bold"><b>B</b></button>
        <button class="tool" data-format="italic"><i>I</i></button>
        <button class="tool" data-format="heading">H2</button>
        <button class="tool" data-format="check">☑</button>
        <button class="tool" data-format="code">&lt;/&gt;</button>
        <button class="tool" data-format="link">Link</button>
        <button class="tool" data-format="quote">❝</button>
        <button class="tool" data-format="bullet">• List</button>

      </div>

      <div class="content">

        <div id="editor" contenteditable="true"></div>

        <div id="preview"></div>

      </div>

      <div id="stats" class="stats">
        0 words · 0 characters · 0 min read
      </div>

    </div>

  </main>

</div>


<!-- GENERIC MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

    <div class="modal-actions">

      <button data-action="close-modal">
        Close
      </button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "studynotes_v3";

let state = {
  notes: [],
  currentId: null,
  folder: "General"
};


/* -------------------------
   LOAD
------------------------- */

function load(){

  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      state = JSON.parse(saved);
    }

  }catch(e){
    console.log(e);
  }

  if(!state.notes || !state.notes.length){

    state.notes = [

      {
        id: Date.now(),
        title:"Welcome",
        content:"Welcome to StudyNotes.\\n\\nStart writing here...",
        folder:"General",
        pinned:false,
        created:Date.now(),
        updated:Date.now()
      },

      {
        id:Date.now()+1,
        title:"Biology revision",
        content:"Cell structure\\n\\n• Cell membrane\\n• Cytoplasm\\n• Nucleus",
        folder:"Biology",
        pinned:false,
        created:Date.now(),
        updated:Date.now()
      },

      {
        id:Date.now()+2,
        title:"Exam notes",
        content:"Important topics for the next exam.",
        folder:"General",
        pinned:true,
        created:Date.now(),
        updated:Date.now()
      }

    ];

  }

  if(!state.currentId){
    state.currentId = state.notes[0].id;
  }

  save();

}


/* -------------------------
   SAVE
------------------------- */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* -------------------------
   CURRENT NOTE
------------------------- */

function currentNote(){

  return state.notes.find(
    n => n.id === state.currentId
  );

}


/* -------------------------
   RENDER NOTES
------------------------- */

function renderNotes(){

  const list = document.getElementById("noteList");

  const search =
    document.getElementById("search").value
    .toLowerCase();

  list.innerHTML = "";

  let notes = state.notes.filter(n => {

    const folderMatch =
      state.folder === "All" ||
      n.folder === state.folder;

    const searchMatch =
      !search ||
      n.title.toLowerCase().includes(search) ||
      n.content.toLowerCase().includes(search);

    return folderMatch && searchMatch;

  });

  notes.sort((a,b)=>{

    if(a.pinned !== b.pinned){
      return a.pinned ? -1 : 1;
    }

    return b.updated - a.updated;

  });

  notes.forEach(note=>{

    const item = document.createElement("div");

    item.className =
      "note-item" +
      (note.id === state.currentId ? " active" : "");

    item.dataset.noteId = note.id;

    item.innerHTML =
      (note.pinned ? "★ " : "") +
      escapeHTML(note.title || "Untitled");

    list.appendChild(item);

  });

}


/* -------------------------
   LOAD NOTE INTO EDITOR
------------------------- */

function renderEditor(){

  const note = currentNote();

  if(!note) return;

  document.getElementById("title").value =
    note.title || "";

  document.getElementById("editor").innerText =
    note.content || "";

  updateStats();

  document.getElementById("status").textContent =
    "Saved";

}


/* -------------------------
   NEW NOTE
------------------------- */

function newNote(){

  const note = {

    id:Date.now(),

    title:"Untitled note",

    content:"",

    folder:state.folder === "All"
      ? "General"
      : state.folder,

    pinned:false,

    created:Date.now(),

    updated:Date.now()

  };

  state.notes.unshift(note);

  state.currentId = note.id;

  save();

  renderNotes();

  renderEditor();

  document.getElementById("title").focus();

}


/* -------------------------
   DELETE
------------------------- */

function deleteNote(){

  const note = currentNote();

  if(!note) return;

  if(!confirm("Delete this note?")) return;

  state.notes =
    state.notes.filter(
      n => n.id !== note.id
    );

  if(!state.notes.length){

    newNote();
    return;

  }

  state.currentId =
    state.notes[0].id;

  save();

  renderNotes();

  renderEditor();

}


/* -------------------------
   DUPLICATE
------------------------- */

function duplicateNote(){

  const note = currentNote();

  if(!note) return;

  const copy = {

    ...note,

    id:Date.now(),

    title:(note.title || "Untitled") + " copy",

    created:Date.now(),

    updated:Date.now(),

    pinned:false

  };

  state.notes.unshift(copy);

  state.currentId = copy.id;

  save();

  renderNotes();

  renderEditor();

}


/* -------------------------
   PIN
------------------------- */

function pinNote(){

  const note = currentNote();

  if(!note) return;

  note.pinned = !note.pinned;

  note.updated = Date.now();

  save();

  renderNotes();

}


/* -------------------------
   SIDEBAR
------------------------- */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("collapsed");

}


/* -------------------------
   AUTOSAVE
------------------------- */

function updateNote(){

  const note = currentNote();

  if(!note) return;

  note.title =
    document.getElementById("title").value;

  note.content =
    document.getElementById("editor").innerText;

  note.updated = Date.now();

  save();

  document.getElementById("status").textContent =
    "Saved";

  renderNotes();

  updateStats();

}


/* -------------------------
   STATS
------------------------- */

function updateStats(){

  const text =
    document.getElementById("editor").innerText.trim();

  const words =
    text ? text.split(/\s+/).length : 0;

  const chars = text.length;

  const minutes =
    Math.max(0,Math.ceil(words / 200));

  document.getElementById("stats").textContent =
    `${words} words · ${chars} characters · ${minutes} min read`;

}


/* -------------------------
   FORMATTING
------------------------- */

function format(type){

  const editor =
    document.getElementById("editor");

  editor.focus();

  const selection =
    window.getSelection();

  const selected =
    selection.toString();

  let replacement = "";

  if(type === "bold")
    replacement = `**${selected || "bold text"}**`;

  if(type === "italic")
    replacement = `*${selected || "italic text"}*`;

  if(type === "heading")
    replacement = `## ${selected || "Heading"}`;

  if(type === "check")
    replacement = `- [ ] ${selected || "Task"}`;

  if(type === "code")
    replacement = `\`\`\`\\n${selected || "code"}\\n\`\`\``;

  if(type === "quote")
    replacement = `> ${selected || "Quote"}`;

  if(type === "bullet")
    replacement = `• ${selected || "List item"}`;

  if(type === "link")
    replacement =
      `[${selected || "Link text"}](https://example.com)`;

  document.execCommand(
    "insertText",
    false,
    replacement
  );

  updateNote();

}


/* -------------------------
   PREVIEW
------------------------- */

function showPreview(){

  const editor =
    document.getElementById("editor");

  const preview =
    document.getElementById("preview");

  if(preview.style.display === "block"){

    preview.style.display = "none";

    editor.style.display = "block";

    return;

  }

  preview.innerHTML =
    markdownToHTML(editor.innerText);

  editor.style.display = "none";

  preview.style.display = "block";

}


/* -------------------------
   SIMPLE MARKDOWN
------------------------- */

function markdownToHTML(text){

  let html =
    escapeHTML(text);

  html =
    html.replace(
      /```([\s\S]*?)```/g,
      "<pre>$1</pre>"
    );

  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  html =
    html.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );

  html =
    html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
      '<a href="$2" target="_blank">$1</a>'
    );

  html =
    html.replace(
      /^> (.*)$/gm,
      "<blockquote>$1</blockquote>"
    );

  html =
    html.replace(
      /^• (.*)$/gm,
      "<li>$1</li>"
    );

  html =
    html.replace(
      /^- \[ \] (.*)$/gm,
      "☐ $1"
    );

  html =
    html.replace(
      /\n/g,
      "<br>"
    );

  return html;

}


/* -------------------------
   MODAL
------------------------- */

function openModal(title,html){

  document.getElementById("modalTitle")
    .textContent = title;

  document.getElementById("modalContent")
    .innerHTML = html;

  document.getElementById("modal")
    .classList.add("show");

}


function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

}


/* -------------------------
   TEMPLATES
------------------------- */

function templates(){

  openModal(
    "Student templates",

    `
    <button class="small-button" data-template="Cornell Notes">
      Cornell Notes
    </button>

    <button class="small-button" data-template="Exam Revision">
      Exam Revision
    </button>

    <button class="small-button" data-template="Lecture Notes">
      Lecture Notes
    </button>

    <button class="small-button" data-template="Essay Plan">
      Essay Plan
    </button>
    `

  );

}


/* -------------------------
   APPLY TEMPLATE
------------------------- */

function applyTemplate(name){

  const templates = {

    "Cornell Notes":
`# Topic

## Questions

## Notes

## Summary
`,

    "Exam Revision":
`# Exam Revision

## Key concepts

## Important facts

## Questions I still have

## Quick summary
`,

    "Lecture Notes":
`# Lecture

## Main ideas

## Details

## Questions

## Summary
`,

    "Essay Plan":
`# Essay

## Thesis

## Argument 1

## Argument 2

## Argument 3

## Conclusion
`

  };

  const note = currentNote();

  if(!note) return;

  note.title = name;

  note.content =
    templates[name] || "";

  note.updated = Date.now();

  save();

  renderNotes();

  renderEditor();

  closeModal();

}


/* -------------------------
   SETTINGS
------------------------- */

function settings(){

  openModal(

    "Settings",

    `
    <p><b>StudyNotes</b></p>

    <button class="small-button" data-action="export">
      Export notes
    </button>

    <button class="small-button" data-action="clear">
      Reset all notes
    </button>

    <p style="color:#777;font-size:13px">
      Notes are stored locally in this browser.
    </p>
    `

  );

}


/* -------------------------
   EXPORT
------------------------- */

function exportNotes(){

  const data =
    JSON.stringify(state.notes,null,2);

  const blob =
    new Blob([data],{type:"application/json"});

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "studynotes-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}


/* -------------------------
   RESET
------------------------- */

function resetNotes(){

  if(!confirm("Delete all StudyNotes data?"))
    return;

  localStorage.removeItem(STORAGE_KEY);

  location.reload();

}


/* -------------------------
   HELP
------------------------- */

function help(){

  openModal(

    "StudyNotes Help",

    `
    <p><b>Ctrl / Cmd + N</b> — New note</p>
    <p><b>Ctrl / Cmd + S</b> — Save</p>
    <p><b>Ctrl / Cmd + F</b> — Search</p>

    `

/* -------------------------
   DRAWING
------------------------- */

function drawing(){

  openModal(

    "Drawing",

    `
    <canvas id="drawCanvas"></canvas>

    <div style="margin-top:10px;display:flex;gap:6px">

      <button class="small-button" data-action="clear-drawing">
        Clear
      </button>

      <button class="small-button" data-action="save-drawing">
        Save drawing
      </button>

    </div>
    `

  );

  setTimeout(initCanvas,50);

}


function initCanvas(){

  const canvas =
    document.getElementById("drawCanvas");

  if(!canvas) return;

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;

  ctx.scale(2,2);

  let drawing = false;

  function position(e){

    const r =
      canvas.getBoundingClientRect();

    const p =
      e.touches ? e.touches[0] : e;

    return {
      x:p.clientX-r.left,
      y:p.clientY-r.top
    };

  }

  function start(e){

    drawing = true;

    const p = position(e);

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);

  }

  function move(e){

    if(!drawing) return;

    const p = position(e);

    ctx.lineWidth = 3;

    ctx.lineCap = "round";

    ctx.strokeStyle = "#111";

    ctx.lineTo(p.x,p.y);

    ctx.stroke();

  }

  function stop(){

    drawing = false;

  }

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",stop);
  canvas.addEventListener("mouseleave",stop);

  canvas.addEventListener("touchstart",start);
  canvas.addEventListener("touchmove",move);
  canvas.addEventListener("touchend",stop);

}


/* -------------------------
   EVENT DELEGATION
   ALL BUTTONS WORK HERE
------------------------- */

document.addEventListener("click",function(e){

  const button =
    e.target.closest("[data-action]");

  if(button){

    const action =
      button.dataset.action;

    if(action === "new")
      newNote();

    if(action === "toggle-sidebar")
      toggleSidebar();

    if(action === "preview")
      showPreview();

    if(action === "pin")
      pinNote();

    if(action === "duplicate")
      duplicateNote();

    if(action === "delete")
      deleteNote();

    if(action === "templates")
      templates();

    if(action === "settings")
      settings();

    if(action === "help")
      help();

    if(action === "draw")
      drawing();

    if(action === "close-modal")
      closeModal();

    if(action === "export")
      exportNotes();

    if(action === "clear")
      resetNotes();

    if(action === "clear-drawing"){

      const canvas =
        document.getElementById("drawCanvas");

      if(canvas){

        const ctx =
          canvas.getContext("2d");

        ctx.clearRect(
          0,0,
          canvas.width,
          canvas.height
        );

      }

    }

  }

  const note =
    e.target.closest(".note-item");

  if(note){

    state.currentId =
      Number(note.dataset.noteId);

    save();

    renderNotes();

    renderEditor();

  }

  const folder =
    e.target.closest(".folder");

  if(folder){

    state.folder =
      folder.dataset.folder;

    renderNotes();

  }

  const tool =
    e.target.closest("[data-format]");

  if(tool){

    format(tool.dataset.format);

  }

  const template =
    e.target.closest("[data-template]");

  if(template){

    applyTemplate(
      template.dataset.template
    );

  }

});

document

  .getElementById("search")

  );


/* -------------------------
   KEYBOARD SHORTCUTS
------------------------- */

document.addEventListener(
  "keydown",
  function(e){

    const modifier =
      e.ctrlKey || e.metaKey;

    if(modifier && e.key.toLowerCase() === "n"){

      e.preventDefault();

      newNote();

    }

    if(modifier && e.key.toLowerCase() === "s"){

      e.preventDefault();

      updateNote();

    }

    if(modifier && e.key.toLowerCase() === "f"){

      e.preventDefault();

      document
        .getElementById("search")
        .focus();

    }

    if(modifier && e.key.toLowerCase() === "b"){

      e.preventDefault();

      format("bold");

    }

    if(modifier && e.key.toLowerCase() === "i"){

      e.preventDefault();

      format("italic");

    }

    if(e.key === "Escape"){

      closeModal();

    }

  }
);


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* -------------------------
   START
------------------------- */

load();

renderNotes();

renderEditor();

</script>
