<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>StudyNotes</title>

<style>
:root{
--bg:#0b0b0d;
--panel:#111114;
--panel2:#17171b;
--line:#2a2a30;
--text:#f5f5f5;
--muted:#92929a;
--soft:#c7c7cc;
--fs:17px
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}

.app{
height:100vh;
display:grid;
grid-template-columns:290px 1fr;
overflow:hidden
}

.sidebar{
background:#0d0d10;
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
min-width:0
}

.brand{
padding:22px 20px 14px;
display:flex;
align-items:center;
gap:11px;
font-weight:750;
font-size:20px
}

.brand-mark{
width:31px;
height:31px;
border:1px solid #777;
border-radius:50%;
position:relative
}

.brand-mark:before,
.brand-mark:after{
content:"";
position:absolute;
inset:6px -2px;
border:1px solid #aaa;
border-radius:50%;
transform:rotate(60deg)
}

.brand-mark:after{
transform:rotate(-60deg)
}

.search{
margin:0 14px 14px;
background:var(--panel2);
border:1px solid var(--line);
border-radius:12px;
padding:10px 12px;
display:flex;
gap:8px
}

.search input{
width:100%;
background:none;
border:0;
outline:0;
color:var(--text)
}

.nav{padding:0 10px}

.nav button,
.folder-row{
width:100%;
border:0;
background:transparent;
padding:10px 11px;
border-radius:11px;
text-align:left;
display:flex;
align-items:center;
gap:10px;
color:var(--soft)
}

.nav button:hover,
.folder-row:hover{
background:#18181c
}

.nav button.active,
.folder-row.active{
background:#202024;
color:#fff
}

.folder-row{cursor:pointer}

.folder-dot{
width:10px;
height:10px;
border-radius:50%;
border:1px solid #777;
background:#555;
flex:none
}

.folder-dot.light{background:#aaa}
.folder-dot.white{background:#eee}
.folder-dot.dark{background:#333}

.section-label{
font-size:11px;
text-transform:uppercase;
letter-spacing:.12em;
color:#666;
padding:18px 12px 7px
}

.sidebar-bottom{
margin-top:auto;
padding:10px;
display:grid;
gap:6px
}

.small-btn{
background:transparent;
border:1px solid transparent;
border-radius:10px;
padding:9px 11px;
text-align:left;
color:var(--muted)
}

.small-btn:hover{
background:#17171a;
color:#fff
}

.main{
min-width:0;
display:flex;
flex-direction:column
}

.topbar{
height:66px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
gap:10px
}

.title-wrap{min-width:0}

.title{
font-size:20px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.sub{
font-size:12px;
color:var(--muted);
margin-top:2px
}

.actions{
display:flex;
gap:7px
}

.icon-btn{
height:38px;
min-width:38px;
padding:0 11px;
border:1px solid var(--line);
background:var(--panel2);
border-radius:11px
}

.icon-btn:hover{background:#242428}

.editor-shell{
flex:1;
min-height:0;
display:grid;
grid-template-columns:1fr 1fr
}

.editor-pane,
.preview-pane{
min-width:0;
overflow:auto
}

.editor-pane{
border-right:1px solid var(--line)
}

.toolbar{
position:sticky;
top:0;
z-index:4;
background:rgba(11,11,13,.94);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);
padding:8px 12px;
display:flex;
gap:5px;
flex-wrap:wrap
}

.tool{
border:1px solid transparent;
background:transparent;
border-radius:8px;
padding:7px 9px;
color:var(--soft)
}

.tool:hover{
background:#1d1d21;
color:#fff
}

textarea#editor{
display:block;
width:100%;
min-height:calc(100% - 55px);
height:100%;
resize:none;
background:transparent;
border:0;
outline:0;
color:var(--text);
padding:28px 30px 100px;
font-size:var(--fs);
line-height:1.65;
letter-spacing:.01em
}

.preview-pane{
padding:30px 34px 100px
}

.markdown{
max-width:820px;
margin:auto;
font-size:var(--fs);
line-height:1.7;
color:#e5e5e8
}

.markdown h1{
font-size:2em;
line-height:1.15
}

.markdown h2{font-size:1.45em}
.markdown h3{font-size:1.15em}

.markdown code{
background:#1c1c20;
padding:2px 6px;
border-radius:6px
}

.markdown pre{
background:#111114;
border:1px solid var(--line);
padding:15px;
border-radius:12px;
overflow:auto
}

.markdown blockquote{
border-left:3px solid #666;
padding-left:15px;
color:#aaa
}

.markdown a{
color:#fff
}

.markdown mark{
background:#555;
color:#fff;
padding:0 2px;
border-radius:2px
}

.status{
position:fixed;
bottom:12px;
right:18px;
background:#111114;
border:1px solid var(--line);
border-radius:10px;
padding:6px 10px;
color:#777;
font-size:11px;
pointer-events:none
}

.empty{
height:100%;
display:grid;
place-items:center;
text-align:center;
color:var(--muted);
padding:40px
}

.empty strong{
display:block;
color:#eee;
font-size:20px;
margin-bottom:7px
}

.notes-list{
overflow:auto;
padding:4px 10px;
min-height:80px
}

.note-item{
padding:11px;
border-radius:12px;
cursor:pointer;
border:1px solid transparent
}

.note-item:hover{background:#161619}

.note-item.active{
background:#202024;
border-color:#2c2c31
}

.note-name{
font-weight:650;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.note-meta{
font-size:11px;
color:#777;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.modal-back{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
display:none;
place-items:center;
z-index:100;
backdrop-filter:blur(7px)
}

.modal-back.show{display:grid}

.modal{
width:min(460px,calc(100% - 30px));
background:#151519;
border:1px solid #303036;
border-radius:20px;
padding:24px;
box-shadow:0 25px 80px #000
}

.modal h2{margin:0 0 8px}

.modal p{
color:#aaa;
line-height:1.5
}

.modal input{
width:100%;
padding:12px;
border-radius:11px;
border:1px solid #38383e;
background:#0d0d10;
color:#fff;
outline:0;
margin:9px 0
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:14px;
flex-wrap:wrap
}

.primary{
background:#f5f5f5;
color:#080808;
border:0;
border-radius:11px;
padding:10px 16px;
font-weight:700
}

.secondary{
background:#222227;
border:1px solid #38383e;
border-radius:11px;
padding:10px 16px
}

.launch{
position:fixed;
inset:0;
background:#080809;
z-index:200;
display:grid;
place-items:center;
transition:opacity .55s ease,visibility .55s
}

.launch.hide{
opacity:0;
visibility:hidden;
pointer-events:none
}

.launch-card{
text-align:center;
animation:rise .8s ease
}

.launch-logo{
width:150px;
height:150px;
object-fit:contain;
filter:grayscale(1);
margin-bottom:22px
}

.launch h1{
font-size:42px;
letter-spacing:-.04em;
margin:0
}

.launch p{
color:#888;
margin:9px 0 28px
}

.start{
padding:13px 28px;
border-radius:13px;
border:1px solid #fff;
background:#fff;
color:#000;
font-weight:750;
font-size:16px
}

.start:hover{
transform:translateY(-1px)
}

@keyframes rise{
from{
opacity:0;
transform:translateY(18px) scale(.97)
}
to{
opacity:1;
transform:none
}
}

.help{
position:fixed;
right:15px;
bottom:42px;
width:34px;
height:34px;
border-radius:50%;
background:#17171b;
border:1px solid #333;
color:#aaa;
z-index:20
}

@media(max-width:900px){

.app{
grid-template-columns:240px 1fr
}

.editor-shell{
grid-template-columns:1fr
}

.preview-pane{
display:none
}

}

@media(max-width:650px){

.app{
grid-template-columns:1fr
}

.sidebar{
display:none
}

.topbar{
padding:0 13px
}

.editor-pane{
border:0
}

textarea#editor{
padding:22px 18px 100px
}

.launch h1{
font-size:34px
}

}
</style>
</head>

<script>

const KEY = "studynotes.v6.notes";
const FKEY = "studynotes.v6.folders";
const PKEY = "studynotes.v6.privateCode";
const SKEY = "studynotes.v6.settings";


let notes =
JSON.parse(
localStorage.getItem(KEY) || "null"
) || [

{
id:crypto.randomUUID(),
title:"Welcome to StudyNotes",
content:
"# Welcome to StudyNotes\n\n"+
"This is your focused space for studying.\n\n"+
"- Create notes\n"+
"- Organize them into folders\n"+
"- Pin important notes\n"+
"- Use Markdown and the live preview\n\n"+
"**Tip:** Press ⌘/Ctrl + N to create a new note.",
folder:"General",
pinned:false,
created:Date.now(),
updated:Date.now()
}

];


let folders =
JSON.parse(
localStorage.getItem(FKEY) || "null"
) || [
"General",
"School",
"Ideas"
];


let settings =
JSON.parse(
localStorage.getItem(SKEY) || "null"
) || {
font:17
};


let state = {

activeId:
notes[0]?.id || null,

filter:"all",

folder:null,

search:"",

privateUnlocked:false

};


function save(){

localStorage.setItem(
KEY,
JSON.stringify(notes)
);

localStorage.setItem(
FKEY,
JSON.stringify(folders)
);

localStorage.setItem(
SKEY,
JSON.stringify(settings)
);

}


function esc(value){

return String(value).replace(
/[&<>"']/g,

function(char){

const map = {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

};

return map[char];

}
);

}


function md(source){

let s = esc(source || "");


s = s.replace(
/```([\s\S]*?)```/g,
"<pre><code>$1</code></pre>"
);


s = s.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
);

s = s.replace(
/^## (.*)$/gm,
"<h2>$1</h2>"
);

s = s.replace(
/^# (.*)$/gm,
"<h1>$1</h1>"
);


s = s.replace(
/^> (.*)$/gm,
"<blockquote>$1</blockquote>"
);


s = s.replace(
/^\- \[ \] (.*)$/gm,
"<div>☐ $1</div>"
);

s = s.replace(
/^\- \[x\] (.*)$/gim,
"<div>☑ $1</div>"
);


s = s.replace(
/^\- (.*)$/gm,
"<div>• $1</div>"
);


s = s.replace(
/^\d+\. (.*)$/gm,
"<div>$&</div>"
);


s = s.replace(
/\*\*(.+?)\*\*/g,
"<strong>$1</strong>"
);

s = s.replace(
/\*(.+?)\*/g,
"<em>$1</em>"
);


s = s.replace(
/`([^`]+)`/g,
"<code>$1</code>"
);


s = s.replace(
/==(.+?)==/g,
"<mark>$1</mark>"
);


s = s.replace(
/$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\(https\?\:\\\/\\\/\[\^\)\]\+\)$end:math:text$/g,
'<a href="$2" target="_blank" rel="noopener">$1</a>'
);


return s
.split(/\n{2,}/)
.map(function(block){

if(
block.match(
/^<(h[1-3]|pre|blockquote|div)/
)
){
return block;
}

return "<p>"+
block.replace(/\n/g,"<br>")+
"</p>";

})
.join("");

}


function current(){

return notes.find(
function(note){
return note.id === state.activeId;
}
);

}


function visibleNotes(){

let result = [...notes];


if(state.filter === "pinned"){

result = result.filter(
note => note.pinned
);

}


if(state.folder){

result = result.filter(
note => note.folder === state.folder
);

}


if(
state.folder === "private" &&
!state.privateUnlocked
){

return [];

}


if(state.search){

const query =
state.search.toLowerCase();

result = result.filter(
note =>
(
note.title +
" " +
note.content
)
.toLowerCase()
.includes(query)
);

}


return result.sort(
(a,b) =>
(b.pinned - a.pinned) ||
((b.updated || 0) -
(b.updated || 0))
);

}


function renderFolders(){

const box =
document.getElementById("folders");

box.innerHTML = "";


[...folders,"private"].forEach(
function(folder,index){

const button =
document.createElement("button");

button.type = "button";

button.className =
"folder-row" +
(state.folder === folder
? " active"
: "");


const dot =
document.createElement("span");

dot.className =
"folder-dot " +
["light","white","dark"][index % 3];


button.appendChild(dot);

button.appendChild(
document.createTextNode(
folder === "private"
? "▣ Private"
: folder
)
);


button.addEventListener(
"click",
function(){

if(folder === "private"){

openPrivate();

}else{

state.folder = folder;
state.filter = "all";
state.activeId = null;

render();

}

}
);


box.appendChild(button);

}
);

}


function renderList(){

const box =
document.getElementById("notesList");

const result =
visibleNotes();

box.innerHTML = "";


if(
state.folder === "private" &&
!state.privateUnlocked
){

box.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>Private is locked</strong>'+
'Unlock it to see your notes.'+
'</div>'+
'</div>';

return;

}


if(!result.length){

box.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>No notes</strong>'+
'Create your first note.'+
'</div>'+
'</div>';

return;

}


result.forEach(
function(note){

const item =
document.createElement("div");

item.className =
"note-item" +
(note.id === state.activeId
? " active"
: "");


const name =
document.createElement("div");

name.className =
"note-name";

name.textContent =
(note.pinned ? "★ " : "") +
(note.title || "Untitled");


const meta =
document.createElement("div");

meta.className =
"note-meta";

meta.textContent =
note.folder +
" · " +
new Date(
note.updated
).toLocaleDateString();


item.appendChild(name);
item.appendChild(meta);


item.addEventListener(
"click",
function(){

state.activeId = note.id;

render();

}
);


box.appendChild(item);

}
);

}


function renderEditor(){

const note = current();

const editor =
document.getElementById("editor");

const preview =
document.getElementById("preview");


if(!note){

document.getElementById(
"noteTitle"
).textContent =
"Select a note";

document.getElementById(
"noteSub"
).textContent =
"StudyNotes";

editor.value = "";

preview.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>Choose a note</strong>'+
'Select one from the sidebar or create a new one.'+
'</div>'+
'</div>';

return;

}


document.getElementById(
"noteTitle"
).textContent =
note.title || "Untitled";


document.getElementById(
"noteSub"
).textContent =
note.folder +
" · Updated " +
new Date(note.updated)
.toLocaleString();


editor.value =
note.content;


preview.innerHTML =
md(note.content);


document.getElementById(
"pinBtn"
).textContent =
note.pinned ? "★" : "☆";


updateStats(note.content);

}


function updateStats(text){

const words =
(text.trim().match(/\S+/g) || [])
.length;

const chars =
text.length;

const minutes =
Math.max(
0,
Math.ceil(words / 200)
);


document.getElementById(
"status"
).textContent =
words +
" words · " +
chars +
" chars · " +
minutes +
" min";

}


function render(){

renderFolders();
renderList();
renderEditor();


document.getElementById(
"allBtn"
).classList.toggle(
"active",
state.filter === "all" &&
!state.folder
);


document.getElementById(
"pinnedBtn"
).classList.toggle(
"active",
state.filter === "pinned"
);

}


function newNote(){

if(
state.folder === "private" &&
!state.privateUnlocked
){

openPrivate();
return;

}


const folder =
state.folder || "General";


const note = {

id:crypto.randomUUID(),

title:"Untitled note",

content:"",

folder:folder,

pinned:false,

created:Date.now(),

updated:Date.now()

};


notes.unshift(note);

state.activeId =
note.id;

save();
render();


setTimeout(
function(){

const editor =
document.getElementById("editor");

editor.focus();

},
50
);

}


function deleteNote(){

const note = current();

if(!note)return;


if(
confirm("Delete this note?")
){

notes =
notes.filter(
item => item.id !== note.id
);

state.activeId =
visibleNotes()[0]?.id || null;

save();
render();

}

}


function duplicate(){

const note = current();

if(!note)return;


const copy = {

...note,

id:crypto.randomUUID(),

title:
(note.title || "Untitled") +
" copy",

created:Date.now(),

updated:Date.now()

};


notes.unshift(copy);

state.activeId =
copy.id;

save();
render();

}


function moveNote(){

const note = current();

if(!note)return;


let choices =
folders.filter(
folder => folder !== "private"
);


if(state.privateUnlocked){

choices.push("private");

}


const target =
prompt(
"Move to folder:\n" +
choices.join("\n"),
note.folder
);


if(
target &&
choices.includes(target)
){

note.folder = target;
note.updated = Date.now();

save();
render();

}

}


function openPrivate(){

const savedCode =
localStorage.getItem(PKEY);


if(!savedCode){

showModal(

"Create your private code",

`
<p>
This is your first time opening Private.
Create a code to protect this folder.
</p>

<p>
<b>
Remember it — it cannot be recovered.
</b>
</p>

<input
id="modalInput"
type="password"
placeholder="Create code">

<div class="modal-actions">

<button
class="secondary"
id="modalCancel"
type="button">
Cancel
</button>

<button
class="primary"
id="modalOK"
type="button">
Create code
</button>

</div>
`,

function(){

const input =
document.getElementById(
"modalInput"
);

const value =
input.value.trim();


if(!value){

alert(
"Please enter a code."
);

return false;

}


localStorage.setItem(
PKEY,
value
);

state.privateUnlocked = true;
state.folder = "private";
state.filter = "all";

state.activeId =
notes.find(
note => note.folder === "private"
)?.id || null;

save();
render();

return true;

}
);

return;

}


showModal(

"Unlock Private",

`
<p>
Enter your private code to continue.
</p>

<input
id="modalInput"
type="password"
placeholder="Private code">

<div class="modal-actions">

<button
class="secondary"
id="modalCancel"
type="button">
Cancel
</button>

<button
class="primary"
id="modalOK"
type="button">
Unlock
</button>

</div>
`,

function(){

const value =
document.getElementById(
"modalInput"
).value;


if(value !== savedCode){

);

return false;

}


state.privateUnlocked = true;
state.folder = "private";

state.activeId =
notes.find(

)?.id || null;

render();

return true;

}
);

}


let modalAction = null;


function showModal(
title,
body,
action
){

const modal =
document.getElementById("modal");


modal.innerHTML =
"<h2>" +
title +
"</h2>" +
body;


document.getElementById(
"modalBack"
).classList.add("show");


modalAction = action;


const ok =
document.getElementById("modalOK");


if(ok){

ok.addEventListener(
"click",
function(){

if(
modalAction &&
modalAction() !== false
){

closeModal();

}

}
);

}


const cancel =
document.getElementById(
"modalCancel"
);


if(cancel){

cancel.addEventListener(
"click",
closeModal
);

}


setTimeout(
function(){

const input =
document.getElementById(
"modalInput"
);

if(input)input.focus();

},
50
);

}


function closeModal(){

document.getElementById(
"modalBack"
).classList.remove("show");

modalAction = null;

}


function addFolder(){

let folder =
prompt(
"New folder name:"
);


if(!folder)return;


folder =
folder.trim();


if(
folder &&
!folders.includes(folder) &&
folder !== "private"
){

folders.push(folder);

save();
render();

}

}

function format(command){

const editor =
document.getElementById("editor");

if(!current())return;


const start =
editor.selectionStart;

const end =
editor.selectionEnd;

const selected =
editor.value.slice(
start,
end
);


let replacement =
selected;


if(command === "bold")
replacement =
"**" + selected + "**";


if(command === "italic")
replacement =
"*" + selected + "*";


if(command === "h1")
replacement =
"# " + selected;


if(command === "h2")
replacement =
"## " + selected;


if(command === "check")
replacement =
"- [ ] " + selected;


if(command === "bullet")
replacement =
"- " + selected;


if(command === "number")
replacement =
"1. " + selected;


if(command === "code")
replacement =
"`" + selected + "`";


if(command === "quote")
replacement =
"> " + selected;


if(command === "link")
replacement =
"[" + selected + "](https://example.com)";


if(command === "highlight")
replacement =
"==" + selected + "==";


editor.setRangeText(
replacement,
start,
end,
"end"
);


saveEditor();

}


function saveEditor(){

const note = current();

if(!note)return;


const editor =
document.getElementById("editor");


note.content =
editor.value;


const firstLine =
editor.value
.split("\n")[0]
.replace(
/^#+\s*/,
""
)
.trim();


note.title =
(
firstLine ||
"Untitled note"
)
.slice(0,80);


note.updated =
Date.now();


save();


document.getElementById(
"noteTitle"
).textContent =
note.title;


document.getElementById(
"noteSub"
).textContent =
note.folder +
" · Just now";


document.getElementById(
"preview"
).innerHTML =
md(note.content);


updateStats(
note.content
);


renderList();

}

document.addEventListener(
"keydown",
function(event){

const shortcut =
event.metaKey ||
event.ctrlKey;


if(
shortcut &&
event.key.toLowerCase() === "n"
){

event.preventDefault();

newNote();

}


if(
shortcut &&
event.key.toLowerCase() === "s"
){

event.preventDefault();

saveEditor();

}


if(
shortcut &&
event.key.toLowerCase() === "f"
){

event.preventDefault();

document.getElementById(
"search"
).focus();

}


if(
shortcut &&
event.key.toLowerCase() === "b" &&
document.activeElement ===
document.getElementById("editor")
){

event.preventDefault();

format("bold");

}


if(
shortcut &&
event.key.toLowerCase() === "i" &&
document.activeElement ===
document.getElementById("editor")
){

event.preventDefault();

format("italic");

}

}
);


document.documentElement
.style
.setProperty(
"--fs",
settings.font + "px"
);


render();
