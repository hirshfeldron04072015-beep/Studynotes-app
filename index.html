<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyNotes</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   INTRO SCREEN
   ========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: introFade 0.9s ease 2.7s forwards;
}

.intro-content {
    text-align: center;
    animation: introContent 1.2s ease forwards;
}

.intro-logo {
    width: 125px;
    height: 125px;
    margin-bottom: 22px;
}

.intro-logo ellipse {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.5;
}

.intro-logo circle {
    fill: #ffffff;
}

.intro-title {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1.5px;
}

.intro-subtitle {
    margin-top: 10px;
    color: #888;
    font-size: 15px;
    letter-spacing: 0.2px;
}

@keyframes introContent {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes introFade {
    to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
}

/* =========================
   APP
   ========================= */

#app {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr) 320px;
    opacity: 0;
    animation: appAppear 0.8s ease 2.8s forwards;
}

@keyframes appAppear {
    to {
        opacity: 1;
    }
}

/* =========================
   SIDEBAR
   ========================= */

.sidebar {
    height: 100%;
    min-width: 0;
    border-right: 1px solid #242424;
    padding: 18px;
    display: flex;
    flex-direction: column;
    background: #090909;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
}

.brand-logo {
    width: 32px;
    height: 32px;
}

.brand-logo ellipse {
    fill: none;
    stroke: #ffffff;
    stroke-width: 3;
}

.brand-logo circle {
    fill: #ffffff;
}

.search {
    width: 100%;
    padding: 10px 11px;
    border-radius: 9px;
    border: 1px solid #292929;
    background: #111111;
    color: #ffffff;
    outline: none;
    margin-bottom: 10px;
}

.search:focus {
    border-color: #555555;
}

.primary-button {
    border: none;
    background: #ffffff;
    color: #000000;
    border-radius: 9px;
    padding: 11px;
    font-weight: 700;
    cursor: pointer;
}

.primary-button:hover {
    opacity: 0.88;
}

.section-label {
    color: #666666;
    font-size: 10px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    margin: 18px 4px 7px;
}

.folder,
.note-item,
.sidebar-button {
    width: 100%;
    border: none;
    background: transparent;
    color: #cccccc;
    border-radius: 8px;
    padding: 9px;
    text-align: left;
    cursor: pointer;
}

.folder:hover,
.note-item:hover,
.sidebar-button:hover {
    background: #171717;
}

.folder.active {
    background: #171717;
    color: #ffffff;
}

.folder-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777777;
    margin-right: 8px;
}

.private-dot {
    background: #ffffff;
    border: 2px solid #666666;
}

#noteList {
    overflow-y: auto;
    min-height: 0;
}

.note-item {
    margin-bottom: 2px;
}

.sidebar-bottom {
    margin-top: auto;
    display: grid;
    gap: 6px;
}

.sidebar-button {
    border: 1px solid #252525;
    background: #111111;
}

/* =========================
   MAIN EDITOR
   ========================= */

.main {
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.topbar {
    min-height: 60px;
    border-bottom: 1px solid #242424;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 13px;
}

.title-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 18px;
    font-weight: 600;
}

.icon-button {
    border: 1px solid #292929;
    background: #111111;
    color: #dddddd;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
}

.icon-button:hover {
    background: #1b1b1b;
}

.editor-area {
    min-height: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.toolbar {
    min-height: 45px;
    border-bottom: 1px solid #1c1c1c;
    padding: 7px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.tool {
    border: 1px solid #292929;
    background: #111111;
    color: #dddddd;
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
}

.tool:hover {
    background: #1a1a1a;
}

#editor {
    width: 100%;
    flex: 1;
    min-height: 0;
    resize: none;
    border: none;
    outline: none;
    background: #080808;
    color: #eeeeee;
    padding: 25px;
    font-size: 17px;
    line-height: 1.7;
}

#preview {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    line-height: 1.7;
}

#preview.visible {
    display: block;
}

#preview h1,
#preview h2,
#preview h3 {
    color: #ffffff;
}

#preview code {
    background: #181818;
    padding: 2px 5px;
    border-radius: 4px;
}

#preview pre {
    background: #111111;
    border: 1px solid #252525;
    border-radius: 9px;
    padding: 14px;
    overflow-x: auto;
}

#preview blockquote {
    border-left: 3px solid #555555;
    padding-left: 14px;
    color: #aaaaaa;
}

#preview a {
    color: #ffffff;
}

.statusbar {
    min-height: 31px;
    border-top: 1px solid #1c1c1c;
    padding: 6px 13px;
    display: flex;
    justify-content: space-between;
    color: #666666;
    font-size: 12px;
}

/* =========================
   RIGHT PANEL
   ========================= */

.right-panel {
    min-width: 0;
    overflow-y: auto;
    border-left: 1px solid #242424;
    padding: 17px;
    background: #090909;
}

.card {
    border: 1px solid #252525;
    background: #101010;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
}

.card-title {
    color: #888888;
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    color: #999999;
}

.stat-row strong {
    color: #ffffff;
    text-align: right;
}

/* =========================
   MODAL
   ========================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 5000;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(500px, 100%);
    background: #111111;
    border: 1px solid #333333;
    border-radius: 14px;
    padding: 20px;
}

.modal-box h2 {
    margin-top: 0;
}

.modal-input,
.modal-select {
    width: 100%;
    padding: 10px;
    background: #080808;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    margin: 10px 0;
    outline: none;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

.secondary-button {
    background: #171717;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
}

/* =========================
   DRAWING
   ========================= */

#drawingCanvas {
    position: fixed;
    inset: 0;
    z-index: 7000;
    display: none;
    width: 100%;
    height: 100%;
    background: #ffffff;
    touch-action: none;
}

#drawingCanvas.open {
    display: block;
}

.drawing-toolbar {
    position: fixed;
    z-index: 7100;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 6px;
    padding: 8px;
    border-radius: 10px;
    background: #111111;
    border: 1px solid #333333;
}

.drawing-toolbar.open {
    display: flex;
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width: 950px) {
    #app {
        grid-template-columns: 235px minmax(0, 1fr);
    }

    .right-panel {
        display: none;
    }
}

@media (max-width: 650px) {
    #app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .topbar {
        padding: 8px;
    }

    .title-input {
        font-size: 16px;
    }

    #editor {
        padding: 18px;
        font-size: 16px;
    }

    .statusbar {
        font-size: 11px;
    }

    .intro-title {
        font-size: 34px;
    }
}
</style>
</head>

<script>

(function () {

    "use strict";


    /* =========================
       STORAGE
       ========================= */

    const STORAGE_KEY = "studynotes-v1";


    let data = null;

    let currentNoteId = null;

    let currentFolder = "all";

    let searchQuery = "";

    let previewMode = false;

    let drawingMode = false;

    let drawing = false;

    let erasing = false;


    /* =========================
       HELPERS
       ========================= */

    function createId() {

        return (
            Date.now().toString(36) +
            Math.random().toString(36).slice(2, 9)
        );

    }


    function escapeHtml(value) {

        return String(value).replace(
            /[&<>"']/g,
            function (character) {

                if (character === "&") return "&amp;";
                if (character === "<") return "&lt;";
                if (character === ">") return "&gt;";
                if (character === '"') return "&quot;";
                return "&#39;";

            }
        );

    }


    function saveData() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

        document.getElementById(
            "saveStatus"
        ).textContent = "Saved just now";

    }


    function loadData() {

        try {

            const saved =
                localStorage.getItem(STORAGE_KEY);

            if (saved) {

                data = JSON.parse(saved);

            }

        } catch (error) {

            data = null;

        }


        if (!data || !Array.isArray(data.notes)) {

            const firstNoteId = createId();

            data = {

                folders: [
                    {
                        id: "general",
                        name: "General",
                        private: false
                    }
                ],

                notes: [
                    {
                        id: firstNoteId,
                        title: "Welcome to StudyNotes",
                        body:
                            "# Welcome\n\n" +
                            "This is your first note. Start writing here.",
                        folder: "general",
                        pinned: true,
                        created: Date.now(),
                        updated: Date.now()
                    }
                ],

                privateFolder: null,

                privateUnlocked: false

            };

        }

    }


    function getCurrentNote() {

        return data.notes.find(
            function (item) {

                return item.id === currentNoteId;

            }
        ) || null;

    }


    function getFolder(id) {

        return data.folders.find(
            function (folder) {

                return folder.id === id;

            }
        ) || null;

    }


    function getFolderName(id) {

        const folder = getFolder(id);

        return folder
            ? folder.name
            : "General";

    }


    function formatDate(timestamp) {

        if (!timestamp) return "—";

        return new Date(timestamp).toLocaleString();

    }


    function countWords(text) {

        const clean = text.trim();

        if (!clean) return 0;

        return clean.split(/\s+/).length;

    }


    /* =========================
       MARKDOWN
       ========================= */

    function renderMarkdown(text) {

        let html = escapeHtml(text);


        html = html.replace(
            /```([\s\S]*?)```/g,
            function (match, code) {

                return "<pre><code>" +
                    code +
                    "</code></pre>";

            }
        );


        html = html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );


        html = html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );


        html = html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );


        html = html.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


        html = html.replace(
            /\*(.+?)\*/g,
            "<em>$1</em>"
        );


        html = html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


        html = html.replace(
            /^> (.*)$/gm,
            "<blockquote>$1</blockquote>"
        );


        html = html.replace(
            /^- $begin:math:display$ $end:math:display$ (.*)$/gm,
            "☐ $1"
        );


        html = html.replace(
            /^- $begin:math:display$x$end:math:display$ (.*)$/gmi,
            "☑ $1"
        );


        html = html.replace(
            /$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\(https\?\:\\\/\\\/\[\^\)\]\+\)$end:math:text$/g,
            '<a href="$2" target="_blank" rel="noopener">$1</a>'
        );


        html = html.replace(
            /\n/g,
            "<br>"
        );


        return html;

    }


    /* =========================
       RENDER
       ========================= */

    function render() {

        renderFolders();

        renderNotes();

        updateEditor();

        updateStatistics();

    }


    function renderFolders() {

        const container =
            document.getElementById("folders");

        container.innerHTML = "";


        const allButton =
            document.createElement("button");

        allButton.className =
            "folder" +
            (
                currentFolder === "all"
                    ? " active"
                    : ""
            );

        allButton.type = "button";

        allButton.innerHTML =
            '<span class="folder-dot"></span>' +
            "All notes";


        allButton.addEventListener(
            "click",
            function () {

                currentFolder = "all";

                render();

            }
        );


        container.appendChild(allButton);


        data.folders.forEach(
            function (folder) {

                if (
                    folder.private &&
                    !data.privateUnlocked
                ) {

                    return;

                }


                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "folder" +
                    (
                        currentFolder === folder.id
                            ? " active"
                            : ""
                    );


                button.innerHTML =
                    '<span class="folder-dot ' +
                    (
                        folder.private
                            ? "private-dot"
                            : ""
                    ) +
                    '"></span>' +
                    escapeHtml(folder.name);


                button.addEventListener(
                    "click",
                    function () {

                        currentFolder =
                            folder.id;

                        render();

                    }
                );


                container.appendChild(button);

            }
        );

    }


    function renderNotes() {

        const container =
            document.getElementById("noteList");

        container.innerHTML = "";


        let notes =
            data.notes.filter(
                function (item) {

                    const folder =
                        getFolder(item.folder);


                    const correctFolder =
                        currentFolder === "all" ||
                        item.folder === currentFolder;


                    const visible =
                        !folder ||
                        !folder.private ||
                        data.privateUnlocked;


                    return (
                        correctFolder &&
                        visible
                    );

                }
            );


        if (searchQuery) {

            const search =
                searchQuery.toLowerCase();


            notes =
                notes.filter(
                    function (item) {

                        return (
                            item.title +
                            " " +
                            item.body
                        )
                        .toLowerCase()
                        .includes(search);

                    }
                );

        }


        notes.sort(
            function (a, b) {

                if (a.pinned !== b.pinned) {

                    return b.pinned - a.pinned;

                }

                return b.updated - a.updated;

            }
        );


        if (!notes.length) {

            const empty =
                document.createElement("div");

            empty.className = "empty";

            empty.textContent =
                "No notes yet.";

            container.appendChild(empty);

            return;

        }


        notes.forEach(
            function (item) {

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className = "note-item";

                button.innerHTML =
                    (
                        item.pinned
                            ? "★ "
                            : ""
                    ) +
                    escapeHtml(
                        item.title ||
                        "Untitled note"
                    );


                button.addEventListener(
                    "click",
                    function () {

                        currentNoteId =
                            item.id;

                        previewMode = false;

                        updatePreviewState();

                        render();

                    }
                );


                container.appendChild(button);

            }
        );

    }


    function updateEditor() {

        const note =
            getCurrentNote();


        const title =
            document.getElementById("title");

        const editor =
            document.getElementById("editor");


        if (!note) {

            title.value = "";

            editor.value = "";

            document.getElementById(
                "pin"
            ).textContent = "☆";

            return;

        }


        title.value =
            note.title;


        editor.value =
            note.body;


        document.getElementById(
            "pin"
        ).textContent =
            note.pinned
                ? "★"
                : "☆";


        document.getElementById(
            "infoFolder"
        ).textContent =
            getFolderName(note.folder);


        document.getElementById(
            "infoCreated"
        ).textContent =
            formatDate(note.created);


        document.getElementById(
            "infoUpdated"
        ).textContent =
            formatDate(note.updated);


        updateStatistics();

    }


    function updateStatistics() {

        const editor =
            document.getElementById("editor");

        const text =
            editor.value;


        const words =
            countWords(text);


        const minutes =
            words === 0
                ? 0
                : Math.max(
                    1,
                    Math.ceil(words / 200)
                );


        document.getElementById(
            "stats"
        ).textContent =
            words +
            " words · " +
            text.length +
            " characters · " +
            minutes +
            " min";


        document.getElementById(
            "totalNotes"
        ).textContent =
            data.notes.length;


        const totalWords =
            data.notes.reduce(
                function (total, item) {

                    return total +
                        countWords(item.body);

                },
                0
            );


        document.getElementById(
            "totalWords"
        ).textContent =
            totalWords;

    }


    /* =========================
       NOTES
       ========================= */

    function createNote() {

        const folder =
            currentFolder !== "all"
                ? currentFolder
                : "general";


        const item = {

            id: createId(),

            title: "Untitled note",

            body: "",

            folder: folder,

            pinned: false,

            created: Date.now(),

            updated: Date.now()

        };


        data.notes.unshift(item);

        currentNoteId =
            item.id;


        saveData();

        render();


        document.getElementById(
            "title"
        ).focus();

    }


    function deleteCurrentNote() {

        const note =
            getCurrentNote();


        if (!note) return;


        showModal(
            "Delete note",
            "<p>Delete <strong>" +
            escapeHtml(note.title) +
            "</strong>?</p>" +
            "<p style='color:#888'>This cannot be undone.</p>",
            "Delete",
            function () {

                data.notes =
                    data.notes.filter(
                        function (item) {

                            return item.id !== note.id;

                        }
                    );


                currentNoteId =
                    data.notes.length
                        ? data.notes[0].id
                        : null;


                saveData();

                closeModal();

                render();

            }
        );

    }


    function duplicateCurrentNote() {

        const note =
            getCurrentNote();


        if (!note) return;


        const duplicate = {

            id: createId(),

            title:
                (note.title || "Untitled note") +
                " copy",

            body: note.body,

            folder: note.folder,

            pinned: note.pinned,

            created: Date.now(),

            updated: Date.now()

        };


        data.notes.unshift(duplicate);

        currentNoteId =
            duplicate.id;


        saveData();

        render();

    }


    function togglePin() {

        const note =
            getCurrentNote();


        if (!note) return;


        note.pinned =
            !note.pinned;


        note.updated =
            Date.now();


        saveData();

        render();

    }


    function moveCurrentNote() {

        const note =
            getCurrentNote();


        if (!note) return;


        let options = "";


        data.folders.forEach(
            function (folder) {

                if (
                    folder.private &&
                    !data.privateUnlocked
                ) {

                    return;

                }


                options +=
                    "<option value='" +
                    escapeHtml(folder.id) +
                    "'" +
                    (
                        folder.id === note.folder
                            ? " selected"
                            : ""
                    ) +
                    ">" +
                    escapeHtml(folder.name) +
                    "</option>";

            }
        );


        showModal(
            "Move note",
            "<select id='moveSelect' class='modal-select'>" +
            options +
            "</select>",
            "Move",
            function () {

                const select =
                    document.getElementById(
                        "moveSelect"
                    );


                note.folder =
                    select.value;


                note.updated =
                    Date.now();


                saveData();

                closeModal();

                render();

            }
        );

    }


    /* =========================
       FOLDERS
       ========================= */

    function createFolder() {

        showModal(
            "New folder",
            "<input id='folderInput' class='modal-input' placeholder='Folder name' autofocus>",
            "Create",
            function () {

                const input =
                    document.getElementById(
                        "folderInput"
                    );


                const name =
                    input.value.trim();


                if (!name) return;


                const folder = {

                    id: createId(),

                    name: name,

                    private: false

                };


                data.folders.push(folder);

                currentFolder =
                    folder.id;


                saveData();

                closeModal();

                render();

            }
        );

    }


    /* =========================
       PRIVATE FOLDER
       ========================= */

    function privateFolder() {

        let folder =
            data.folders.find(
                function (item) {

                    return item.private;

                }
            );


        if (!folder) {

            showModal(
                "Create private folder",
                "<input id='privateCode' class='modal-input' type='password' placeholder='Create a code'>",
                "Create",
                function () {

                    const input =
                        document.getElementById(
                            "privateCode"
                        );


                    const code =
                        input.value;


                    if (!code) return;


                    folder = {

                        id: createId(),

                        name: "Private",

                        private: true

                    };


                    data.folders.push(folder);


                    /*
                       Client-side lock.
                       This is not secure encryption.
                    */

                    data.privateCode =
                        btoa(code);


                    data.privateUnlocked =
                        true;


                    currentFolder =
                        folder.id;


                    saveData();

                    closeModal();

                    render();

                }
            );


            return;

        }


        if (data.privateUnlocked) {

            currentFolder =
                folder.id;

            render();

            return;

        }


        showModal(
            "Private folder",
            "<input id='privateCode' class='modal-input' type='password' placeholder='Enter code'>",
            "Unlock",
            function () {

                const input =
                    document.getElementById(
                        "privateCode"
                    );


                if (
                    btoa(input.value) !==
                    data.privateCode
                ) {

                    alert("Wrong code");

                    return;

                }


                data.privateUnlocked =
                    true;


                currentFolder =
                    folder.id;


                saveData();

                closeModal();

                render();

            }
        );

    }


    /* =========================
       MODAL
       ========================= */

    function showModal(
        title,
        body,
        confirmText,
        action
    ) {

        document.getElementById(
            "modalTitle"
        ).textContent =
            title;


        document.getElementById(
            "modalBody"
        ).innerHTML =
            body;


        document.getElementById(
            "modalConfirm"
        ).textContent =
            confirmText;


        document.getElementById(
            "modal"
        ).classList.add("open");


        document.getElementById(
            "modalConfirm"
        ).onclick =
            function () {

                action();

            };


        document.getElementById(
            "modalCancel"
        ).onclick =
            closeModal;

    }


    function closeModal() {

        document.getElementById(
            "modal"
        ).classList.remove("open");

    }


    /* =========================
       TEMPLATES
       ========================= */

    function showTemplates() {

        showModal(
            "Student templates",

            "<button id='lectureTemplate' class='sidebar-button' style='width:100%;margin-bottom:7px'>Lecture notes</button>" +

            "<button id='examTemplate' class='sidebar-button' style='width:100%;margin-bottom:7px'>Exam revision</button>" +

            "<button id='projectTemplate' class='sidebar-button' style='width:100%'>Project</button>",

            "Close",

            closeModal
        );


        document.getElementById(
            "lectureTemplate"
        ).onclick =
            function () {

                createTemplate(
                    "Lecture notes",
                    "# Lecture notes\n\n## Topic\n\n## Key ideas\n\n## Questions\n\n## Summary"
                );

            };


        document.getElementById(
            "examTemplate"
        ).onclick =
            function () {

                createTemplate(
                    "Exam revision",
                    "# Exam revision\n\n## What I need to know\n\n## Definitions\n\n## Practice questions\n\n## Last-minute summary"
                );

            };


        document.getElementById(
            "projectTemplate"
        ).onclick =
            function () {

                createTemplate(
                    "Project",
                    "# Project\n\n## Goal\n\n## Research\n\n## Tasks\n\n## Sources\n\n## Conclusion"
                );

            };

    }


    function createTemplate(
        title,
        body
    ) {

        const folder =
            currentFolder !== "all"
                ? currentFolder
                : "general";


        const item = {

            id: createId(),

            title: title,

            body: body,

            folder: folder,

            pinned: false,

            created: Date.now(),

            updated: Date.now()

        };


        data.notes.unshift(item);

        currentNoteId =
            item.id;


        saveData();

        closeModal();

        render();

    }


    /* =========================
       SETTINGS
       ========================= */

    function showSettings() {

        showModal(
            "Settings",

            "<p style='color:#999'>Your notes are stored locally in this browser.</p>" +

            "<button id='exportData' class='sidebar-button' style='width:100%;margin-bottom:7px'>Export backup</button>" +

            "<button id='resetData' class='sidebar-button' style='width:100%'>Reset all data</button>",

            "Close",

            closeModal
        );


        document.getElementById(
            "exportData"
        ).onclick =
            exportBackup;


        document.getElementById(
            "resetData"
        ).onclick =
            resetData;

    }


    function exportBackup() {

        const json =
            JSON.stringify(
                data,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "studynotes-backup.json";


        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

    }


    function resetData() {

        const confirmed =
            window.confirm(
                "Delete all StudyNotes data?"
            );


        if (!confirmed) return;


        localStorage.removeItem(
            STORAGE_KEY
        );


        window.location.reload();

    }


    /* =========================
       HELP
       ========================= */

    function showHelp() {

        showModal(
            "Help & shortcuts",

            "<p><strong>Cmd/Ctrl + N</strong> — New note</p>" +

            "<p><strong>Cmd/Ctrl + F</strong> — Search</p>" +

            "<p><strong>Cmd/Ctrl + B</strong> — Bold</p>" +

            "<p><strong>Cmd/Ctrl + I</strong> — Italic</p>" +

            "<p style='color:#888'>Markdown is supported. Notes are saved locally in your browser.</p>",

            "Close",

            closeModal
        );

    }


    /* =========================
       FORMATTING
       ========================= */

    function formatSelection(type) {

        const editor =
            document.getElementById(
                "editor"
            );


        const start =
            editor.selectionStart;


        const end =
            editor.selectionEnd;


        const selected =
            editor.value.slice(
                start,
                end
            )
            || "text";


        let before = "";

        let after = "";


        if (type === "bold") {

            before = "**";
            after = "**";

        }


        if (type === "italic") {

            before = "*";
            after = "*";

        }


        if (type === "h2") {

            before = "## ";

        }


        if (type === "check") {

            before = "- [ ] ";

        }


        if (type === "code") {

            before = "`";
            after = "`";

        }


        if (type === "link") {

            before = "[";
            after = "](https://example.com)";

        }


        if (type === "quote") {

            before = "> ";

        }


        editor.setRangeText(
            before +
            selected +
            after,
            start,
            end,
            "select"
        );


        editor.dispatchEvent(
            new Event("input")
        );


        editor.focus();

    }


    /* =========================
       PREVIEW
       ========================= */

    function updatePreviewState() {

        const editor =
            document.getElementById(
                "editor"
            );


        const preview =
            document.getElementById(
                "preview"
            );


        const button =
            document.getElementById(
                "previewButton"
            );


        if (previewMode) {

            preview.innerHTML =
                renderMarkdown(
                    editor.value
                );


            preview.classList.add(
                "visible"
            );


            editor.style.display =
                "none";


            button.textContent =
                "Edit";

        } else {

            preview.classList.remove(
                "visible"
            );


            editor.style.display =
                "block";


            button.textContent =
                "Preview";

        }

    }


    /* =========================
       DRAWING
       ========================= */

    const canvas =
        document.getElementById(
            "drawingCanvas"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    function resizeCanvas() {

        canvas.width =
            window.innerWidth;

        canvas.height =
            window.innerHeight;

    }


    function openDrawing() {

        resizeCanvas();

        drawingMode = true;

        canvas.classList.add(
            "open"
        );


        document.getElementById(
            "drawingToolbar"
        ).classList.add(
            "open"
        );

    }


    function closeDrawing() {

        drawingMode = false;

        drawing = false;

        canvas.classList.remove(
            "open"
        );


        document.getElementById(
            "drawingToolbar"
        ).classList.remove(
            "open"
        );

    }


    function getPointerPosition(event) {

        return {

            x: event.clientX,

            y: event.clientY

        };

    }


    canvas.addEventListener(
        "pointerdown",
        function (event) {

            drawing = true;

            canvas.setPointerCapture(
                event.pointerId
            );


            const point =
                getPointerPosition(event);


            ctx.beginPath();

            ctx.moveTo(
                point.x,
                point.y
            );

        }
    );


    canvas.addEventListener(
        "pointermove",
        function (event) {

            if (!drawing) return;


            const point =
                getPointerPosition(event);


            ctx.lineWidth =
                erasing
                    ? 25
                    : 4;


            ctx.lineCap =
                "round";


            ctx.strokeStyle =
                erasing
                    ? "#ffffff"
                    : "#000000";


            ctx.lineTo(
                point.x,
                point.y
            );


            ctx.stroke();

        }
    );


    canvas.addEventListener(
        "pointerup",
        function () {

            drawing = false;

        }
    );


    canvas.addEventListener(
        "pointercancel",
        function () {

            drawing = false;

        }
    );


    /* =========================
       INITIALIZE
       ========================= */

    function initializeApp() {

        loadData();


        if (!currentNoteId && data.notes.length) {

            currentNoteId =
                data.notes[0].id;

        }


        /* New note */

        document.getElementById(
            "newNote"
        ).addEventListener(
            "click",
            createNote
        );


        /* New folder */

        document.getElementById(
            "newFolder"
        ).addEventListener(
            "click",
            createFolder
        );


        /* Templates */

        document.getElementById(
            "templates"
        ).addEventListener(
            "click",
            showTemplates
        );


        /* Settings */

        document.getElementById(
            "settings"
        ).addEventListener(
            "click",
            showSettings
        );


        /* Help */

        document.getElementById(
            "help"
        ).addEventListener(
            "click",
            showHelp
        );


        /* Drawing */

        document.getElementById(
            "draw"
        ).addEventListener(
            "click",
            openDrawing
        );


        document.getElementById(
            "closeDrawing"
        ).addEventListener(
            "click",
            closeDrawing
        );


        document.getElementById(
            "clearCanvas"
        ).addEventListener(
            "click",
            function () {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            }
        );


        document.getElementById(
            "blackPen"
        ).addEventListener(
            "click",
            function () {

                erasing = false;

            }
        );


        document.getElementById(
            "greyPen"
        ).addEventListener(
            "click",
            function () {

                erasing = false;

                ctx.strokeStyle =
                    "#888888";

            }
        );


        document.getElementById(
            "eraser"
        ).addEventListener(
            "click",
            function () {

                erasing = true;

            }
        );


        /* Private */

        document.getElementById(
            "privateFolder"
        ).addEventListener(
            "click",
            privateFolder
        );


        /* Search */

        document.getElementById(
            "search"
        ).addEventListener(
            "input",
            function (event) {

                searchQuery =
                    event.target.value;

                render();

            }
        );


        /* Clear search */

        document.getElementById(
            "clearSearch"
        ).addEventListener(
            "click",
            function () {

                searchQuery = "";

                document.getElementById(
                    "search"
                ).value = "";

                render();

            }
        );


        /* Title */

        document.getElementById(
            "title"
        ).addEventListener(
            "input",
            function (event) {

                const note =
                    getCurrentNote();


                if (!note) return;


                note.title =
                    event.target.value;


                note.updated =
                    Date.now();


                saveData();

                renderNotes();

            }
        );


        /* Editor */

        document.getElementById(
            "editor"
        ).addEventListener(
            "input",
            function (event) {

                const note =
                    getCurrentNote();


                if (!note) return;


                note.body =
                    event.target.value;


                note.updated =
                    Date.now();


                saveData();

                updateStatistics();

            }
        );


        /* Pin */

        document.getElementById(
            "pin"
        ).addEventListener(
            "click",
            togglePin
        );


        /* Duplicate */

        document.getElementById(
            "duplicate"
        ).addEventListener(
            "click",
            duplicateCurrentNote
        );


        /* Move */

        document.getElementById(
            "move"
        ).addEventListener(
            "click",
            moveCurrentNote
        );


        /* Delete */

        document.getElementById(
            "delete"
        ).addEventListener(
            "click",
            deleteCurrentNote
        );


        /* Preview */

        document.getElementById(
            "previewButton"
        ).addEventListener(
            "click",
            function () {

                previewMode =
                    !previewMode;

                updatePreviewState();

            }
        );


        /* Toolbar */

        document
            .querySelectorAll(".tool")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            formatSelection(
                                button.dataset.format
                            );

                        }
                    );

                }
            );


        /* Keyboard shortcuts */

        document.addEventListener(
            "keydown",
            function (event) {

                const modifier =
                    event.ctrlKey ||
                    event.metaKey;


                if (
                    modifier &&
                    event.key.toLowerCase() === "n"
                ) {

                    event.preventDefault();

                    createNote();

                }


                if (
                    modifier &&
                    event.key.toLowerCase() === "f"
                ) {

                    event.preventDefault();

                    document.getElementById(
                        "search"
                    ).focus();

                }


                if (
                    modifier &&
                    event.key.toLowerCase() === "b"
                ) {

                    event.preventDefault();

                    formatSelection("bold");

                }


                if (
                    modifier &&
                    event.key.toLowerCase() === "i"
                ) {

                    event.preventDefault();

                    formatSelection("italic");

                }

            }
        );


        /* Modal background */

        document.getElementById(
            "modal"
        ).addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    document.getElementById("modal")
                ) {

                    closeModal();

                }

            }
        );


        /* Resize drawing canvas */

        window.addEventListener(
            "resize",
            function () {

                if (drawingMode) {

                    resizeCanvas();

                }

            }
        );


        /* First render */

        render();

    }


    /* =========================
       START
       ========================= */

    document.addEventListener(
        "DOMContentLoaded",
        initializeApp
    );

})();

</script>
