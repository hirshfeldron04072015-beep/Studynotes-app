<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyNotes</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#080808;
color:#f5f5f5;
}

button,input,textarea{
font:inherit;
}

button{
cursor:pointer;
}

#startup{
position:fixed;
inset:0;
z-index:9999;
background:#080808;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
transition:opacity .8s ease,visibility .8s ease;
}

#startup.hidden{
opacity:0;
visibility:hidden;
pointer-events:none;
}

.startup-content{
animation:intro .9s ease;
}

@keyframes intro{
0%{opacity:0;transform:translateY(25px) scale(.96)}
100%{opacity:1;transform:translateY(0) scale(1)}
}

.logo{
width:150px;
height:150px;
margin:auto;
animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

.startup-title{
font-size:44px;
font-weight:700;
letter-spacing:-2px;
margin-top:22px;
}

.startup-subtitle{
color:#858585;
margin-top:8px;
margin-bottom:30px;
}

.start-button{
background:#fff;
color:#000;
border:0;
border-radius:14px;
padding:15px 30px;
font-size:17px;
font-weight:700;
transition:transform .2s ease,opacity .2s ease;
}

.start-button:hover{
transform:scale(1.04);
}

.start-button:active{
transform:scale(.97);
}

#app{
display:none;
height:100vh;
overflow:hidden;
}

#app.visible{
display:grid;
grid-template-columns:280px 1fr;
}

.sidebar{
background:#101010;
border-right:1px solid #292929;
display:flex;
flex-direction:column;
min-width:0;
}

.brand{
padding:22px;
font-size:21px;
font-weight:700;
display:flex;
align-items:center;
gap:10px;
}

.mini-logo{
width:30px;
height:30px;
}

.search-box{
margin:0 14px 15px;
background:#191919;
border:1px solid #292929;
border-radius:12px;
padding:10px 12px;
}

.search-box input{
width:100%;
border:0;
outline:0;
background:transparent;
color:#fff;
}

.nav{
padding:0 10px;
}

.nav-button{
width:100%;
border:0;
background:transparent;
color:#aaa;
padding:11px;
border-radius:10px;
text-align:left;
margin-bottom:3px;
}

.nav-button:hover,
.nav-button.active{
background:#222;
color:#fff;
}

.section-title{
font-size:11px;
color:#666;
text-transform:uppercase;
letter-spacing:2px;
padding:18px 14px 8px;
}

.folder{
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
margin:0 10px 3px;
border-radius:10px;
color:#aaa;
cursor:pointer;
}

.folder:hover,
.folder.active{
background:#222;
color:#fff;
}

.folder-dot{
width:10px;
height:10px;
border-radius:50%;
background:#777;
}

.notes-list{
overflow:auto;
padding:8px 10px;
flex:1;
}

.note{
padding:11px;
border-radius:11px;
margin-bottom:3px;
cursor:pointer;
}

.note:hover{
background:#191919;
}

.note.active{
background:#252525;
}

.note-title{
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.note-info{
font-size:11px;
color:#666;
margin-top:4px;
}

.bottom-buttons{
padding:10px;
border-top:1px solid #292929;
}

.bottom-button{
width:100%;
background:transparent;
border:0;
color:#888;
text-align:left;
padding:10px;
border-radius:9px;
}

.bottom-button:hover{
background:#1b1b1b;
color:#fff;
}

.main{
min-width:0;
display:flex;
flex-direction:column;
}

.topbar{
height:67px;
border-bottom:1px solid #292929;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.current-title{
font-size:20px;
font-weight:700;
}

.current-info{
font-size:11px;
color:#666;
margin-top:3px;
}

.actions{
display:flex;
gap:6px;
}

.action{
height:38px;
min-width:38px;
border:1px solid #303030;
background:#171717;
color:#ccc;
border-radius:10px;
}

.action:hover{
background:#252525;
color:#fff;
}

.editor-area{
display:grid;
grid-template-columns:1fr 1fr;
flex:1;
min-height:0;
}

.editor-side{
border-right:1px solid #292929;
min-width:0;
display:flex;
flex-direction:column;
}

.toolbar{
padding:8px 10px;
border-bottom:1px solid #292929;
display:flex;
gap:4px;
flex-wrap:wrap;
}

.tool{
background:transparent;
border:0;
color:#aaa;
border-radius:7px;
padding:7px 9px;
}

.tool:hover{
background:#222;
color:#fff;
}

#editor{
flex:1;
width:100%;
resize:none;
border:0;
outline:0;
background:#080808;
color:#eee;
padding:28px;
font-size:17px;
line-height:1.7;
}

.preview{
overflow:auto;
padding:30px;
}

.preview-content{
max-width:800px;
margin:auto;
line-height:1.7;
}

.preview-content h1{
font-size:34px;
}

.preview-content h2{
font-size:25px;
}

.preview-content code{
background:#1c1c1c;
padding:3px 6px;
border-radius:5px;
}

.preview-content pre{
background:#151515;
border:1px solid #292929;
border-radius:12px;
padding:15px;
overflow:auto;
}

.preview-content blockquote{
border-left:3px solid #666;
padding-left:15px;
color:#aaa;
}

.preview-content mark{
background:#555;
color:#fff;
}

.stats{
position:fixed;
right:15px;
bottom:12px;
font-size:11px;
color:#666;
background:#121212;
border:1px solid #292929;
border-radius:9px;
padding:6px 9px;
}

.help-button{
position:fixed;
right:15px;
bottom:50px;
width:34px;
height:34px;
border-radius:50%;
border:1px solid #333;
background:#181818;
color:#aaa;
}

.modal-background{
position:fixed;
inset:0;
z-index:5000;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-background.show{
display:flex;
}

.modal{
width:min(440px,100%);
background:#171717;
border:1px solid #333;
border-radius:20px;
padding:25px;
}

.modal h2{
margin-top:0;
}

.modal p{
color:#aaa;
line-height:1.6;
}

.modal input{
width:100%;
background:#0c0c0c;
border:1px solid #383838;
color:#fff;
border-radius:10px;
padding:12px;
outline:0;
margin:8px 0;
}

.modal-buttons{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:15px;
}

.cancel{
background:#222;
border:1px solid #333;
color:#ddd;
padding:10px 16px;
border-radius:10px;
}

.confirm{
background:#fff;
color:#000;
border:0;
padding:10px 16px;
border-radius:10px;
font-weight:700;
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#777;
padding:30px;
}

.empty strong{
display:block;
font-size:20px;
color:#eee;
margin-bottom:8px;
}

@media(max-width:850px){

#app.visible{
grid-template-columns:230px 1fr;
}

.editor-area{
grid-template-columns:1fr;
}

.preview{
display:none;
}

}

@media(max-width:600px){

#app.visible{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.startup-title{
font-size:36px;
}

.topbar{
padding:0 12px;
}

}
</style>
</head>

<script>

(function(){

"use strict";


const NOTES_KEY =
"studynotes_notes";

const FOLDERS_KEY =
"studynotes_folders";

const PRIVATE_KEY =
"studynotes_private_code";


let notes;

let folders;

try{

notes =
JSON.parse(
localStorage.getItem(NOTES_KEY)
);

}catch(error){

notes=null;

}


try{

folders =
JSON.parse(
localStorage.getItem(FOLDERS_KEY)
);

}catch(error){

folders=null;

}


if(!Array.isArray(notes)){

notes=[
{
id:"welcome",
title:"Welcome to StudyNotes",
content:
"# Welcome to StudyNotes\n\n"+
"Your focused space for studying.\n\n"+
"- Create notes\n"+
"- Organize folders\n"+
"- Pin important notes\n"+
"- Use Markdown\n\n"+
"Press **＋** to create a note.",
folder:"General",
pinned:false,
updated:Date.now()
}
];

}


if(!Array.isArray(folders)){

folders=[
"General",
"School",
"Ideas"
];

}


let activeId =
notes.length
? notes[0].id
: null;


let activeFolder = null;

let filter = "all";

let searchText = "";

let privateUnlocked = false;


function save(){

localStorage.setItem(
NOTES_KEY,
JSON.stringify(notes)
);

localStorage.setItem(
FOLDERS_KEY,
JSON.stringify(folders)
);

}


function getCurrent(){

return notes.find(
note => note.id === activeId
);

}


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function markdown(text){

let html =
escapeHTML(text || "");


html =
html.replace(
/```([\s\S]*?)```/g,
"<pre><code>$1</code></pre>"
);


html =
html.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
);

html =
html.replace(
/^## (.*)$/gm,
"<h2>$1</h2>"
);

html =
html.replace(
/^# (.*)$/gm,
"<h1>$1</h1>"
);


html =
html.replace(
/^> (.*)$/gm,
"<blockquote>$1</blockquote>"
);


html =
html.replace(
/^- \[ \] (.*)$/gm,
"<div>☐ $1</div>"
);

html =
html.replace(
/^- \[x\] (.*)$/gim,
"<div>☑ $1</div>"
);


html =
html.replace(
/^- (.*)$/gm,
"<div>• $1</div>"
);


html =
html.replace(
/^\d+\. (.*)$/gm,
"<div>$&</div>"
);


html =
html.replace(
/\*\*(.+?)\*\*/g,
"<strong>$1</strong>"
);


html =
html.replace(
/\*(.+?)\*/g,
"<em>$1</em>"
);


html =
html.replace(
/`([^`]+)`/g,
"<code>$1</code>"
);


html =
html.replace(
/==(.+?)==/g,
"<mark>$1</mark>"
);


html =
html.replace(
/$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\(https\?\:\\\/\\\/\[\^\)\]\+\)$end:math:text$/g,
'<a href="$2" target="_blank" rel="noopener">$1</a>'
);


return html
.split(/\n\n+/)
.map(function(block){

if(
block.startsWith("<h1>") ||
block.startsWith("<h2>") ||
block.startsWith("<h3>") ||
block.startsWith("<pre>") ||
block.startsWith("<blockquote>") ||
block.startsWith("<div>")
){

return block;

}

return "<p>"+
block.replace(/\n/g,"<br>")+
"</p>";

})
.join("");

}


function visibleNotes(){

let result =
notes.slice();


if(filter === "pinned"){

result =
result.filter(
note => note.pinned
);

}


if(activeFolder){

result =
result.filter(
note => note.folder === activeFolder
);

}


if(
activeFolder === "Private" &&
!privateUnlocked
){

return [];

}


if(searchText){

const q =
searchText.toLowerCase();

result =
result.filter(
note =>
(
note.title+
" "+
note.content
)
.toLowerCase()
.includes(q)
);

}


result.sort(
(a,b)=>
(b.pinned?1:0) -
(a.pinned?1:0) ||
(b.updated-a.updated)
);


return result;

}


function renderFolders(){

const container =
document.getElementById("folders");

container.innerHTML = "";


folders.forEach(
function(folder,index){

const row =
document.createElement("div");

row.className =
"folder"+
(activeFolder === folder
? " active"
: "");


const dot =
document.createElement("span");

dot.className =
"folder-dot";


dot.style.background =
["#555","#888","#bbb"][index%3];


row.appendChild(dot);

row.appendChild(
document.createTextNode(folder)
);


row.addEventListener(
"click",
function(){

activeFolder=folder;
filter="all";
activeId=null;

render();

}
);


container.appendChild(row);

}
);


const privateRow =
document.createElement("div");

privateRow.className =
"folder"+
(activeFolder === "Private"
? " active"
: "");


const privateDot =
document.createElement("span");

privateDot.className =
"folder-dot";

privateDot.style.background =
"#333";


privateRow.appendChild(
privateDot
);

privateRow.appendChild(
document.createTextNode(
"▣ Private"
)
);


privateRow.addEventListener(
"click",
openPrivate
);


container.appendChild(
privateRow
);

}


function renderNotes(){

const list =
document.getElementById("notesList");

const result =
visibleNotes();

list.innerHTML = "";


if(
activeFolder === "Private" &&
!privateUnlocked
){

list.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>Private is locked</strong>'+
'Enter your code to open it.'+
'</div>'+
'</div>';

return;

}


if(result.length === 0){

list.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>No notes</strong>'+
'Create your first note.'+
'</div>'+
'</div>';

return;

}


result.forEach(
function(note){

const item =
document.createElement("div");

item.className =
"note"+
(note.id === activeId
? " active"
: "");


const title =
document.createElement("div");

title.className =
"note-title";

title.textContent =
(note.pinned ? "★ " : "")+
(note.title || "Untitled");


const info =
document.createElement("div");

info.className =
"note-info";

info.textContent =
note.folder+
" · "+
new Date(
note.updated
).toLocaleDateString();


item.appendChild(title);
item.appendChild(info);


item.addEventListener(
"click",
function(){

activeId=note.id;

render();

}
);


list.appendChild(item);

}
);

}


function renderEditor(){

const note =
getCurrent();

const editor =
document.getElementById("editor");

const preview =
document.getElementById("preview");


if(!note){

document.getElementById(
"currentTitle"
).textContent =
"Select a note";

document.getElementById(
"currentInfo"
).textContent =
"StudyNotes";

editor.value="";

preview.innerHTML =
'<div class="empty">'+
'<div>'+
'<strong>Choose a note</strong>'+
'Select a note from the sidebar.'+
'</div>'+
'</div>';

return;

}


document.getElementById(
"currentTitle"
).textContent =
note.title || "Untitled";


document.getElementById(
"currentInfo"
).textContent =
note.folder+
" · "+
new Date(
note.updated
).toLocaleString();


editor.value =
note.content || "";


preview.innerHTML =
markdown(note.content);


document.getElementById(
"pin"
).textContent =
note.pinned ? "★" : "☆";


updateStats(
note.content || ""
);

}


function updateStats(text){

const words =
(text.trim().match(/\S+/g)||[])
.length;

const chars =
text.length;

const minutes =
Math.ceil(words/200);


document.getElementById(
"stats"
).textContent =
words+
" words · "+
chars+
" chars · "+
minutes+
" min";

}


function render(){

renderFolders();
renderNotes();
renderEditor();

}


function createNote(){

if(
activeFolder === "Private" &&
!privateUnlocked
){

openPrivate();

return;

}


const note={

id:
Date.now().toString()+
Math.random().toString(16),

title:"Untitled note",

content:"",

folder:
activeFolder || "General",

pinned:false,

updated:Date.now()

};


notes.unshift(note);

activeId=note.id;

save();
render();


setTimeout(
function(){

document
.getElementById("editor")
.focus();

},
50
);

}


function deleteNote(){

const note =
getCurrent();

if(!note)return;


if(
!confirm(
"Delete this note?"
)
)return;


notes =
notes.filter(
item => item.id !== note.id
);


activeId =
notes[0]?.id || null;

save();
render();

}


function duplicateNote(){

const note =
getCurrent();

if(!note)return;


const copy={
...note,
id:
Date.now().toString()+
Math.random().toString(16),
title:
(note.title||"Untitled")+
" copy",
updated:Date.now()
};


notes.unshift(copy);

activeId=copy.id;

save();
render();

}


function pinNote(){

const note =
getCurrent();

if(!note)return;


note.pinned =
!note.pinned;

note.updated =
Date.now();

save();
render();

}


function moveNote(){

const note =
getCurrent();

if(!note)return;


const choices =
folders.slice();


if(privateUnlocked)
choices.push("Private");


const destination =
prompt(
"Type the folder name:\n\n"+
choices.join("\n"),
note.folder
);


if(
destination &&
choices.includes(destination)
){

note.folder =
destination;

note.updated =
Date.now();

save();
render();

}

}


function addFolder(){

const name =
prompt(
"New folder name:"
);


if(!name)return;


const clean =
name.trim();


if(
!clean ||
folders.includes(clean) ||
clean === "Private"
){

alert(
"That folder name cannot be used."
);

return;

}


folders.push(clean);

save();
render();

}

function showModal(

content,
action
){

const background =
document.getElementById(
"modalBackground"
);

const modal =
document.getElementById(
"modal"
);


modal.innerHTML =
"<h2>"+
title+
"</h2>"+
content;


background.classList.add(
"show"
);


const confirmButton =
document.getElementById(
"modalConfirm"
);


if(confirmButton){

confirmButton.addEventListener(
"click",
function(){

const result =
action();

if(result !== false){

closeModal();

}

},
{once:true}
);

}


const cancelButton =
document.getElementById(
"modalCancel"
);


if(cancelButton){

cancelButton.addEventListener(
"click",
closeModal,
{once:true}
);

}


setTimeout(
function(){

const input =
document.getElementById(
"privateInput"
);

if(input)input.focus();

},
100
);

}


function closeModal(){

document
.getElementById(
"modalBackground"

}

function format(command){

const editor =
document.getElementById(
"editor"
);

const note =
getCurrent();


if(!note)return;


const start =
editor.selectionStart;

const end =
editor.selectionEnd;

const selected =
editor.value.substring(
start,
end
);


let result =
selected;


if(command==="bold")
result="**"+selected+"**";


if(command==="italic")
result="*"+selected+"*";


if(command==="h1")
result="# "+selected;


if(command==="h2")
result="## "+selected;


if(command==="check")
result="- [ ] "+selected;


if(command==="bullet")
result="- "+selected;


if(command==="number")
result="1. "+selected;


if(command==="code")
result="`"+selected+"`";


if(command==="quote")
result="> "+selected;


if(command==="link")
result=
"["+selected+
"](https://example.com)";


if(command==="highlight")
result=
"=="+selected+"==";


editor.setRangeText(
result,
start,
end,
"end"
);


saveEditor();

}


function saveEditor(){

const note =
getCurrent();

if(!note)return;


const editor =
document.getElementById(
"editor"
);


note.content =
editor.value;


const first =
editor.value
.split("\n")[0]
.replace(/^#+\s*/,"")
.trim();


note.title =
(first || "Untitled")
.substring(0,80);


note.updated =
Date.now();


save();


renderEditor();
renderNotes();

}

.addEventListener(

event.target.id ===
"modalBackground"
){

}
);


/* KEYBOARD SHORTCUTS */

document.addEventListener(
"keydown",
function(event){

const shortcut =
event.ctrlKey ||
event.metaKey;


if(
shortcut &&
event.key.toLowerCase()==="n"
){

event.preventDefault();

createNote();

}


if(
shortcut &&
event.key.toLowerCase()==="s"
){

event.preventDefault();

saveEditor();

}


if(
shortcut &&
event.key.toLowerCase()==="f"
){

event.preventDefault();

document
.getElementById("search")
.focus();

}


if(
shortcut &&
event.key.toLowerCase()==="b" &&
document.activeElement ===
document.getElementById("editor")
){

event.preventDefault();

format("bold");

}


if(
shortcut &&
event.key.toLowerCase()==="i" &&
document.activeElement ===
document.getElementById("editor")
){

event.preventDefault();

format("italic");

}

}
);


/* INITIAL RENDER */

save();

render();

})();
